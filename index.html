let AC=null, musicOn=false, musicTimer=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==="suspended")AC.resume(); return AC; }
function tone(f,d=0.15,type="sine",v=0.22,delay=0){
  const c=ac(); if(!c)return;
  const o=c.createOscillator(), g=c.createGain(), t=c.currentTime+delay;
  o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.05);
}

const LobbyMusic={
  timer:null, step:0, nextT:0, on:true, BPM:112,
  chords:[[60,64,67],[55,59,62],[57,60,64],[53,57,60]], // C – G – Am – F
  bass:[48,43,45,41], // C3 G2 A2 F2
  mel:[ // giai điệu vui tươi: 8 nốt móc đơn / ô nhịp (0 = nghỉ)
    [64,0,67,0,69,0,67,0],
    [62,0,65,0,67,0,65,0],
    [69,0,72,0,69,0,67,0],
    [65,0,64,0,62,0,64,0]],
  mf(n){ return 440*Math.pow(2,(n-69)/12); },
  mtone(f,when,d,type,v){
    const c=AC; if(!c) return;
    try{
      const o=c.createOscillator(), g=c.createGain();
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,when);
      g.gain.exponentialRampToValueAtTime(v,when+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,when+d);
      o.connect(g); g.connect(c.destination); o.start(when); o.stop(when+d+0.05);
    }catch(e){}
  },
  start(){
    const c=ac(); if(!c||!this.on) return;
    this.stop();
    this.step=0; this.nextT=c.currentTime+0.15;
    this.timer=setInterval(()=>this.sched(),90);
  },
  stop(){ if(this.timer){ clearInterval(this.timer); this.timer=null; } },
  sched(){
    const c=AC; if(!c||!this.timer) return;
    if(c.state!=="running"){ try{ c.resume(); }catch(e){} return; }
    const e8=60/this.BPM/2;
    let guard=0;
    while(this.nextT < c.currentTime+0.4 && guard++<16){
      this.playStep(this.step,this.nextT);
      this.nextT+=e8; this.step=(this.step+1)%32;
    }
  },
  playStep(s,t){
    const bar=(s/8)|0, st=s%8;
    if(st===0||st===4) this.mtone(this.mf(this.bass[bar]),t,0.32,"sine",0.15);
    if(st%2===0) this.chords[bar].forEach(f=>this.mtone(this.mf(f),t,0.2,"triangle",0.045));
    const m=this.mel[bar][st];
    if(m) this.mtone(this.mf(m),t,0.26,"triangle",0.11);
  }
};
function toggleLobbyMusic(){

}

const fxC=document.getElementById("fx"), fxX=fxC.getContext("2d");
let parts=[], fxRun=false;
function fxSize(){ fxC.width=innerWidth; fxC.height=innerHeight; }
addEventListener("resize",fxSize); fxSize();
function boom(x,y,n=60){
  const cols=["#ffd94d","#ff6b6b","#4f7cff","#37d67a","#ff9ff3","#fff"];
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=2+Math.random()*6;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:60+Math.random()*40,c:cols[i%cols.length]}); }
  if(!fxRun){ fxRun=true; requestAnimationFrame(fxTick); }
}
function fireworks(n=5){ for(let i=0;i<n;i++) setTimeout(()=>boom(Math.random()*fxC.width,Math.random()*fxC.height*0.6),i*350); }
function fxTick(){
  fxX.clearRect(0,0,fxC.width,fxC.height);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life--;
    fxX.globalAlpha=Math.min(1,p.life/40); fxX.fillStyle=p.c;
    fxX.beginPath(); fxX.arc(p.x,p.y,3,0,7); fxX.fill(); });
  fxX.globalAlpha=1;
  if(parts.length) requestAnimationFrame(fxTick); else { fxRun=false; fxX.clearRect(0,0,fxC.width,fxC.height); }
}

    <div class="planlist">${PLANS.map(pl=>`<button class="plan" data-plan="${pl.id}" onclick="selectPlan('${pl.id}')">
      <span><span class="pname">${pl.name}</span>${pl.tag?`<span class="plantag">${pl.tag}</span>`:""}<br><span class="pper">${pl.perDay}</span></span>
      <span class="pprice">${pl.priceText}</span></button>`).join("")}</div>
    <div id="upPay" class="uppay" style="display:none">

      <div class="upsteps" id="upSteps"></div>

function selectPlan(id){
  upPlan=PLANS.find(x=>x.id===id)||null; if(!upPlan) return;
  document.querySelectorAll(".plan").forEach(b=>b.classList.toggle("on",b.dataset.plan===id));
  const pay=document.getElementById("upPay"); if(pay) pay.style.display="";
  const pr=document.getElementById("upPrice"); if(pr) pr.textContent="Gói "+upPlan.name+" — "+upPlan.priceText;
  const st=document.getElementById("upSteps");
  if(st) st.innerHTML=`
      <p><b>1.</b> Quét mã QR để kết bạn Zalo với thầy Phong</p>
      <p><b>2.</b> Chuyển khoản <b>${upPlan.priceText}</b> (gói ${upPlan.name})</p>
      <p><b>3.</b> Sau khi thanh toán, <b>chụp lại bill</b> gửi qua Zalo + nhắn tin <b>"Mua tài khoản game quiz - Gói ${upPlan.name}"</b> để được cấp tài khoản ngay</p>`;
  SFX.click();
}

let cfYesCb=null;
function askConfirm(msg,onYes){
  let m=document.getElementById("cfModal");
  if(!m){ m=document.createElement("div"); m.id="cfModal"; m.className="upmodal";
    m.addEventListener("click",e=>{ if(e.target===m) closeConfirm(); });
    document.body.appendChild(m); }
  cfYesCb=onYes;
  m.innerHTML=`<div class="upbox"><h2>\u2753 Xác nhận</h2><p class="sub">${msg}</p>
    <button class="btn big green" onclick="confirmYes()">\u2705 Đồng ý</button><br>
    <button class="btn big" onclick="closeConfirm()">\u21A9 Để sau</button></div>`;
  m.style.display="flex";
}
function confirmYes(){ const cb=cfYesCb; cfYesCb=null; closeConfirm(); if(cb) cb(); }
function closeConfirm(){ const m=document.getElementById("cfModal"); if(m) m.style.display="none"; }

  roomTheme=t; SFX.click();
  document.querySelectorAll(".themebtn").forEach(b=>b.classList.toggle("on",b.dataset.theme===t));
}
function applyTheme(){
  document.body.dataset.gtheme=((room&&room.theme)||"classic")==="adventure"?"adventure":"classic";
}

let roomAnsAll=[], streakMap={}; // mọi đáp án trong phòng + streak từng bạn
function streakOf(rows,cur){
  let st=0;
  for(let i=cur;i>=0;i--){ const a=rows.find(r=>r.q_index===i); if(a&&a.is_correct) st++; else break; }
  return st;
}
function comboBonus(st){ return st>=2?(st-1)*25:0; }
/* ===== HƯỚNG 2 - GĐ1: Chặng + Xu Lá Chắn + Boss Trùm Virus =====
   Xu + Boss chỉ tính từ bảng answers, KHÔNG lưu DB, KHÔNG migration.
   - Chặng: bộ đề chia 3 chặng (vd 5 câu -> 2/2/1, 20 câu -> 7/7/6).
   - Xu: đúng +10, chuỗi đúng >=3 thêm +5, hoàn thành 1 chặng (trả lời hết câu trong chặng) +20, thắng boss +30.
   - Boss: 3 câu lớp sai nhiều nhất, 100 máu, sát thương = % lớp đúng x 35 / câu. */
function stageBounds(N){ const b=[0]; for(let s=1;s<3;s++) b.push(Math.min(N,Math.ceil(s*N/3))); b.push(N); return b; }
function stageOfIdx(idx,N){ const b=stageBounds(N); for(let s=0;s<3;s++) if(idx>=b[s]&&idx<b[s+1]) return s; return 2; }
function stageMapHtml(curIdx,N){
  const b=stageBounds(N);
  return `<div class="stagmap">${[0,1,2].map(s=>{
    const done=curIdx>=b[s+1]&&b[s+1]>b[s];
    const cur=(curIdx<0&&s===0)||(curIdx>=b[s]&&curIdx<b[s+1]);
    return `<span class="stag${done?" done":cur?" cur":""}">${done?"✅":cur?"▶":"🔒"} Chặng ${s+1}</span>`;
  }).join("")}</div>`;
}
function stageDoneBanner(idx,N){ const b=stageBounds(N); for(let s=0;s<3;s++) if(idx+1===b[s+1]&&b[s+1]>b[s]) return `<div class="stagebanner">🎉 Mở khóa Chặng ${s+1}! +20 Xu 🪙</div>`; return ""; }

function coinsFor(pid,rows,N,won){
  const map={}; (rows||[]).forEach(a=>{ if(a.player_id===pid&&a.q_index>=0&&a.q_index<N) map[a.q_index]=a; });
  let coins=0;
  const streakAt=qi=>{ let st=0; for(let i=qi;i>=0;i--){ if(map[i]&&map[i].is_correct) st++; else break; } return st; };
  for(let qi=0;qi<N;qi++){ const a=map[qi]; if(a&&a.is_correct){ coins+=10; if(streakAt(qi)>=3) coins+=5; } }
  const b=stageBounds(N);
  for(let s=0;s<3;s++){ if(b[s+1]<=b[s]) continue; let full=true; for(let qi=b[s];qi<b[s+1];qi++) if(!map[qi]){ full=false; break; } if(full) coins+=20; }
  if(won) coins+=30;
  return coins;
}
const BOSS_QBASE=1000; // đáp án boss lưu ở answers với q_index = 1000 + số thứ tự câu boss (không đụng câu chính, không tính điểm)

function bossPickQs(all,N){
  const stats=[]; for(let qi=0;qi<N;qi++){ const rows=all.filter(a=>a.q_index===qi); const wrong=rows.filter(a=>!a.is_correct).length; stats.push({qi,total:rows.length,wrong,rate:rows.length?wrong/rows.length:0}); }
  stats.sort((a,b)=> b.wrong-a.wrong || b.rate-a.rate || a.qi-b.qi);
  const picked=stats.filter(s=>s.wrong>0).slice(0,3).map(s=>s.qi);
  if(picked.length<3){
    const rest=stats.filter(s=>!picked.includes(s.qi)).map(s=>s.qi);
    let h=2166136261; const seed=String(room&&room.id||"")+"#boss"; for(let k=0;k<seed.length;k++){ h^=seed.charCodeAt(k); h=Math.imul(h,16777619); }
    let s=h>>>0; const rnd=()=>{ s|=0; s=(s+0x6D2B79F5)|0; let tt=Math.imul(s^(s>>>15),1|s); tt=(tt+Math.imul(tt^(tt>>>7),61|tt))^tt; return ((tt^(tt>>>14))>>>0)/4294967296; };
    for(let i=rest.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const tmp=rest[i]; rest[i]=rest[j]; rest[j]=tmp; }
    while(picked.length<3&&rest.length) picked.push(rest.shift());
  }
  return picked.slice(0,3);
}
function bossDmgFor(all,k){ const rows=all.filter(a=>a.q_index===BOSS_QBASE+k); if(!rows.length) return {dmg:0,correct:0,total:0}; const c=rows.filter(a=>a.is_correct).length; return {dmg:Math.round(c/rows.length*35),correct:c,total:rows.length}; }
function bossHpAfter(all,upto){ let hp=100; for(let k=0;k<upto;k++) hp-=bossDmgFor(all,k).dmg; return Math.max(0,hp); }
function bossWonFrom(all){ return bossQs.length>0&&bossHpAfter(all,bossQs.length)<=0; }
function bossReset(){ bossQs=[]; bossHp=100; bossIdx=0; bossWon=false; bossPlayed=false; bossLocked=false; bossResults=[]; }

/* ĐẢO ĐÁP ÁN: thứ tự đáp án hiển thị được xáo trộn NGẪU NHIÊN theo từng ván chơi (mỗi ván có room.id
   khác nhau) và từng câu hỏi, nhưng GIỐNG NHAU trên máy thầy và máy học sinh — không cần đổi database. */
function optOrder(q,qi){
  const n=(q&&q.options)?q.options.length:0;
  const cur=(typeof qi!=="undefined")?qi:((room&&typeof room.current!=="undefined")?room.current:0);
  const seedStr=((room&&room.id)?room.id:"")+"#"+cur;
  let h=2166136261;
  for(let k=0;k<seedStr.length;k++){ h^=seedStr.charCodeAt(k); h=Math.imul(h,16777619); }
  let s=h>>>0;
  const rnd=()=>{ s|=0; s=(s+0x6D2B79F5)|0; let t=Math.imul(s^(s>>>15),1|s); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; };
  const a=[]; for(let i=0;i<n;i++) a.push(i);
  for(let i=n-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

function normBlank(s){ return String(s||"").toLowerCase().trim().replace(/\s+/g," "); }
function stripAcc(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"d"); }
function blankCorrect(q,ans){
  const a=normBlank(ans); if(!a) return false;
  return (q.options||[]).some(o=>{ const b=normBlank(o); return b&& (b===a || stripAcc(b)===stripAcc(a)); });
}

      <div id="examOpts" style="display:none;margin:.4em 0"><b>⏱️ Thời gian làm bài:</b>
        <select id="examMin"><option value="15">15 phút</option><option value="30" selected>30 phút</option><option value="45">45 phút</option><option value="60">60 phút</option></select></div>
      <p class="note">🚀 Tự động: HS tự làm hết câu hỏi theo nhịp riêng — thầy chỉ bấm <b>Bắt đầu</b> 1 lần và <b>Kết thúc</b> khi muốn.${canAuto()?"":" <b>Chỉ tài khoản trả phí.</b>"}</p>
      <p class="note">📝 Kiểm tra: HS làm bài theo nhịp riêng, <b>đảo câu hỏi + đáp án riêng từng bạn</b>, có đồng hồ đếm ngược — chấm theo thang 10, hỗ trợ cả 4 dạng câu hỏi.${canAuto()?"":" <b>Chỉ tài khoản trả phí.</b>"}</p>
      <div id="bossRow" style="margin:.4em 0"><label style="cursor:pointer"><input type="checkbox" id="bossOn" checked style="width:auto"> <b>👹 Trùm Virus cuối màn</b></label>
      <p class="note">Sau câu cuối, cả lớp cùng đánh 👹 Trùm Virus (3 câu ôn lại) — thắng được +30 Xu mỗi bạn. Không có thua, không tính điểm xếp hạng. Chế độ Kiểm tra không có boss.</p></div>
      <button class="btn big green" onclick="tCreateRoom()">🚀 Tạo phòng</button><br>
      <button class="btn small" onclick="showTeacherRejoin()">🔑 Vào lại phòng cũ bằng PIN</button>`;
  });
}

<script>
/* ================= NGÂN HÀNG CÂU HỎI ================= */
function isDefaultSet(s){ return !!(s&&s.set_name&&String(s.set_name).startsWith("📌")); } // bộ đề mặc định: không sửa/xóa
function tBankTab(){
  loadBank().then(()=>{
    const items=bank.map(s=>{ const def=isDefaultSet(s);
      return `<div class="bankitem"><div><b>${esc(s.set_name)}</b>${def?` <span class="tag">📌 Mặc định</span>`:""}<br><span class="note">${s.questions.length} câu hỏi</span></div>
      <div><button class="btn small" onclick="tSetDetail('${s.id}')">${def?"👁️ Xem":"✏️ Sửa"}</button>
      ${bankReadOnly||def?"":`<button class="btn small red" onclick="tDelSet('${s.id}')">🗑️</button>`}</div></div>`; }).join("");
    document.getElementById("tBody").innerHTML=`
      ${bankReadOnly?`<div class="cfgwarn">⚠️ Chưa kết nối được bảng ngân hàng (thầy chạy file <b>supabase-v2-migration.sql</b> trong SQL Editor rồi tải lại trang để bật chế độ đầy đủ).</div>`:""}
      <div style="text-align:left;max-width:640px;margin:0 auto">${items||'<p class="note">Chưa có bộ đề nào.</p>'}</div>
      ${bankReadOnly?"":`<button class="btn green" onclick="tNewSet()">➕ Tạo bộ đề mới</button>`}
      <p class="note">Bộ đề lưu trên Supabase — dùng máy nào cũng thấy.</p>`;
  });
}
async function tNewSet(){
  if(bankReadOnly){ alert("Thầy chạy file supabase-v2-migration.sql trong SQL Editor trước nhé!"); return; }
  const nm=prompt("Tên bộ đề mới:"); if(!nm) return;
  const {data}=await sb.from("question_bank").insert({set_name:nm,questions:[]}).select().single();
  if(data){ bank.push(data); tSetDetail(data.id); }
  else alert("Không lưu được. Kiểm tra mạng nhé thầy!");
}
async function tDelSet(id){
  const s=bank.find(x=>x.id===id);
  if(isDefaultSet(s)){ alert("📌 Bộ đề mặc định không thể xóa."); return; }
  if(!confirm(`Xóa bộ đề "${s?s.set_name:""}"?`)) return;
  if(!String(id).startsWith("fb")) await sb.from("question_bank").delete().eq("id",id);
  bank=bank.filter(x=>x.id!==id); tBankTab();
}
function tSetDetail(id){
  const s=bank.find(x=>x.id===id); if(!s) return;
  const def=isDefaultSet(s);
  const rows=s.questions.map((q,i)=>`<div class="qrow">${typeTag(q)}<b>Câu ${i+1}:</b> ${esc(q.q)}
    ${bankReadOnly||def?"":`<div style="margin-top:8px"><button class="btn small" onclick="tQForm('${id}',${i})">✏️ Sửa</button>
    <button class="btn small red" onclick="tQDel('${id}',${i})">🗑️ Xóa</button></div>`}</div>`).join("");
  document.getElementById("tBody").innerHTML=`
    <h3>📚 ${esc(s.set_name)} (${s.questions.length} câu)${def?` <span class="tag">📌 Mặc định</span>`:""}</h3>
    ${def?`<p class="note">📌 Bộ đề mặc định của hệ thống — không thể sửa, xóa hay thêm câu hỏi.</p>`:""}
    <div style="text-align:left;max-width:640px;margin:0 auto">${rows||'<p class="note">Chưa có câu hỏi nào.</p>'}</div>
    ${bankReadOnly||def?"":`<button class="btn green" onclick="tQForm('${id}',-1)">➕ Thêm câu hỏi</button>
      <button class="btn purple" onclick="tBulkForm('${id}')">📥 Nhập hàng loạt</button>`}
    <button class="btn" onclick="tBankTab()">← Về danh sách</button>`;
}
function tQDel(sid,i){
  const s=bank.find(x=>x.id===sid);
  if(isDefaultSet(s)){ alert("📌 Bộ đề mặc định không thể xóa câu hỏi."); return; }
  if(!confirm("Xóa câu hỏi này?")) return;
  s.questions.splice(i,1); tQSave(sid);
}
async function tQSave(sid){
  const s=bank.find(x=>x.id===sid);
  if(isDefaultSet(s)){ alert("📌 Bộ đề mặc định không thể sửa."); tSetDetail(sid); return; }
  if(!String(sid).startsWith("fb")) await sb.from("question_bank").update({questions:s.questions}).eq("id",sid);
  tSetDetail(sid);
}
function tQOptInputs(t,q){
  const opts=(q&&q.options)||[];
  if(t==="truefalse") return `<label><b>Các đáp án:</b></label><br><p class="note">Dạng Đúng/Sai dùng sẵn 2 đáp án: <b>1. Đúng</b> — <b>2. Sai</b></p>`;
  if(t==="reorder") return `<label><b>Các bước (nhập theo <u>đúng thứ tự</u> từ 1 đến 4):</b></label><br>`+
    [0,1,2,3].map(j=>`<input type="text" id="opt${j}" placeholder="Bước ${j+1} (theo đúng thứ tự)" value="${esc(opts[j]||"")}">`).join("")+
    `<p class="note">💡 Khi chơi, thứ tự các bước sẽ bị đảo lộn — học sinh bấm theo đúng thứ tự để ghi điểm (đúng từng vị trí vẫn được điểm).</p>`;
  if(t==="fillblank") return `<label><b>Đáp án đúng (có thể thêm cách viết khác):</b></label><br>`+
    [0,1,2].map(j=>`<input type="text" id="opt${j}" placeholder="${j===0?"Đáp án đúng (bắt buộc)":"Cách viết khác "+j+" (không bắt buộc)"}" value="${esc(opts[j]||"")}">`).join("")+
    `<p class="note">💡 Hệ thống tự chấp nhận chữ hoa/thường và không dấu (VD: "Hà Nội" = "ha noi").</p>`;
  return `<label><b>Các đáp án:</b></label><br>`+
    [0,1,2,3].map(j=>`<input type="text" id="opt${j}" placeholder="Đáp án ${j+1}" value="${esc(opts[j]||"")}">`).join("");
}
function tQForm(sid,i){
  const s=bank.find(x=>x.id===sid);
  const q=i>=0?s.questions[i]:{type:"choice",q:"",options:["","","",""],correct:0,explain:"",image_url:""};
  editingQ={sid,i};
  const typeOpts=[["choice","Trắc nghiệm 4 đáp án"],["truefalse","Đúng / Sai"],["reorder","🔢 Sắp xếp thứ tự"],["fillblank","✏️ Điền từ"]]
    .map(([v,l])=>`<option value="${v}" ${q.type===v?"selected":""}>${l}</option>`).join("");
  const hideCorrect=(q.type==="reorder"||q.type==="fillblank");
  document.getElementById("tBody").innerHTML=`
    <h3>${i>=0?"✏️ Sửa câu hỏi":"➕ Thêm câu hỏi"} — ${esc(s.set_name)}</h3>
    <div style="text-align:left;max-width:640px;margin:0 auto">
      <label><b>Dạng câu hỏi:</b></label><br>
      <select id="qType" onchange="tQTypeChange()">${typeOpts}</select><br>
      <label><b>Câu hỏi:</b></label>
      <textarea id="qText" placeholder="Nhập câu hỏi...">${esc(q.q)}</textarea><br>
      <div id="optBox">${tQOptInputs(q.type,q)}</div>
      <div id="correctBox" style="${hideCorrect?"display:none":""}">
      <label><b>Đáp án đúng (số thứ tự, bắt đầu từ 1):</b></label><br>
      <input type="text" id="qCorrect" inputmode="numeric" value="${(q.correct??0)+1}" style="max-width:120px"><br>
      </div>
      <label><b>Giải thích (hiện sau khi chốt đáp án):</b></label>
      <textarea id="qExplain" placeholder="Giải thích...">${esc(q.explain||"")}</textarea><br>
      <label><b>Link hình minh họa (không bắt buộc):</b></label><br>
      <input type="text" id="qImg" placeholder="https://..." value="${esc(q.image_url||"")}"><br>
      <span class="note">💡 Muốn có ảnh minh họa đẹp? Gửi ý tưởng vào chat với trợ lý, em vẽ rồi đưa link cho thầy dán vào đây.</span><br><br>
      <button class="btn big green" onclick="tQSubmit()">💾 Lưu câu hỏi</button>
      <button class="btn" onclick="tSetDetail('${sid}')">Hủy</button>
    </div>`;
}
function tQTypeChange(){
  const t=document.getElementById("qType").value;
  document.getElementById("optBox").innerHTML=tQOptInputs(t,{options:[]});
  document.getElementById("correctBox").style.display=(t==="reorder"||t==="fillblank")?"none":"";
}
function tQSubmit(){
  const {sid,i}=editingQ;
  const s=bank.find(x=>x.id===sid);
  const type=document.getElementById("qType").value;
  const qText=document.getElementById("qText").value.trim();
  if(!qText){ alert("Thầy nhập câu hỏi đã nhé!"); return; }
  let options, correct;
  if(type==="truefalse"){ options=["Đúng","Sai"]; correct=parseInt(document.getElementById("qCorrect").value)-1; }
  else if(type==="reorder"){
    options=[0,1,2,3].map(j=>document.getElementById("opt"+j).value.trim());
    if(options.some(o=>!o)){ alert("Thầy nhập đủ 4 bước theo đúng thứ tự nhé!"); return; }
    correct=0;
  }
  else if(type==="fillblank"){
    options=[0,1,2].map(j=>document.getElementById("opt"+j).value.trim()).filter(o=>o);
    if(!options.length){ alert("Thầy nhập ít nhất 1 đáp án đúng nhé!"); return; }
    correct=0;
  }
  else{
    options=[0,1,2,3].map(j=>document.getElementById("opt"+j).value.trim());
    if(options.some(o=>!o)){ alert("Thầy nhập đủ 4 đáp án nhé!"); return; }
    correct=parseInt(document.getElementById("qCorrect").value)-1;
  }
  if(!(correct>=0&&correct<options.length)){ alert("Số thứ tự đáp án đúng chưa hợp lệ!"); return; }
  const q={type,q:qText,options,correct,explain:document.getElementById("qExplain").value.trim(),image_url:document.getElementById("qImg").value.trim()};
  if(i>=0) s.questions[i]=q; else s.questions.push(q);
  SFX.correct(); tQSave(sid);
}
/* ---- Nhập hàng loạt ---- */
function tBulkForm(sid){
  const s=bank.find(x=>x.id===sid); if(!s) return;
  document.getElementById("tBody").innerHTML=`
    <h3>📥 Nhập hàng loạt — ${esc(s.set_name)}</h3>
    <div style="text-align:left;max-width:640px;margin:0 auto">
      <p class="note">Dán danh sách câu hỏi theo định dạng JSON rồi bấm "Nhập".
      <button class="btn small" onclick="tBulkSample()">📋 Xem mẫu</button></p>
      <textarea id="bulkText" style="min-height:220px;font-family:monospace;font-size:.9rem" placeholder='[{"type":"choice","q":"...","options":["A","B","C","D"],"correct":0,"explain":"...","image_url":""}]'></textarea>
      <div id="bulkErr" style="margin:6px 0"></div>
      <button class="btn big green" onclick="tBulkSubmit('${sid}')">📥 Nhập câu hỏi</button>
      <button class="btn" onclick="tSetDetail('${sid}')">Hủy</button>
    </div>`;
}
function tBulkSample(){
  document.getElementById("bulkText").value=JSON.stringify([
    {"type":"choice","q":"Câu hỏi ví dụ?","options":["Đáp án 1","Đáp án 2","Đáp án 3","Đáp án 4"],"correct":1,"explain":"Giải thích...","image_url":""},
    {"type":"truefalse","q":"Câu đúng/sai ví dụ?","options":["Đúng","Sai"],"correct":0,"explain":"Giải thích...","image_url":""},
    {"type":"reorder","q":"Xếp đúng thứ tự các bước rửa tay?","options":["Làm ướt tay","Thoa xà phòng","Chà kỹ kẽ ngón tay","Rửa sạch với nước"],"correct":0,"explain":"...","image_url":""},
    {"type":"fillblank","q":"Thủ đô của Việt Nam là ...","options":["Hà Nội","Ha Noi"],"correct":0,"explain":"...","image_url":""}
  ],null,1);
}
function tBulkSubmit(sid){
  const s=bank.find(x=>x.id===sid); if(!s) return;
  if(isDefaultSet(s)){ alert("📌 Bộ đề mặc định không thể thêm câu hỏi."); return; }
  let arr;
  try{ arr=JSON.parse(document.getElementById("bulkText").value); if(!Array.isArray(arr)) throw 0; }
  catch(e){ document.getElementById("bulkErr").innerHTML=`<div class="cfgwarn">⚠️ Nội dung chưa đúng định dạng JSON. Bấm "Xem mẫu" để tham khảo nhé!</div>`; return; }
  const ok=[];
  const TYPES=["choice","truefalse","reorder","fillblank"];
  for(const x of arr){
    if(!x||!x.q) continue;
    const type=TYPES.includes(x.type)?x.type:"choice";
    let options=null;
    if(type==="truefalse") options=["Đúng","Sai"];
    else if(type==="fillblank"){ const a=Array.isArray(x.options)?x.options.map(String).filter(o=>o.trim()):[]; if(a.length) options=a; }
    else if(Array.isArray(x.options)&&x.options.length===4&&x.options.every(o=>String(o).trim())) options=x.options.map(String);
    if(!options) continue;
    let correct=type==="choice"?(parseInt(x.correct)||0):0; if(correct<0||correct>=options.length) correct=0;
    ok.push({type,q:String(x.q),options,correct,explain:String(x.explain||""),image_url:String(x.image_url||"")});
  }
  if(!ok.length){ document.getElementById("bulkErr").innerHTML=`<div class="cfgwarn">⚠️ Không có câu hỏi hợp lệ nào để nhập.</div>`; return; }
  s.questions=s.questions.concat(ok);
  SFX.fanfare(); fireworks(4); tQSave(sid);
}
</script>

<script>
/* ================= 🤖 AI TẠO CÂU HỎI (Gemini) ================= */
function tAITab(){
  const key=localStorage.getItem("gemini_key")||"";
  document.getElementById("tBody").innerHTML=`
    <div style="text-align:left;max-width:640px;margin:0 auto">
      <div class="aimsg">🤖 <b>Trợ lý AI tạo câu hỏi.</b> Thầy nhập ý tưởng (ví dụ: <i>"an toàn khi dùng mạng xã hội, lớp 4, 5 câu"</i>),
      AI sẽ sinh câu hỏi đủ 4 dạng (trắc nghiệm, đúng/sai, sắp xếp, điền từ) kèm giải thích. Thầy duyệt rồi lưu vào ngân hàng.<br><br>
      🔑 Cần <b>Gemini API key miễn phí</b> — dán vào ô dưới, key chỉ lưu trên máy thầy.</div>
      <details class="aiguide"><summary>📖 Cách lấy Gemini API key miễn phí (làm 1 lần, khoảng 2 phút)</summary>
      <ol>
        <li>Mở trang <b><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a></b> rồi đăng nhập tài khoản Google (tài khoản Gmail thường là được).</li>
        <li>Bấm nút <b>"Create API key"</b> (hoặc "Get API key").</li>
        <li>Nếu được hỏi, chọn tạo key trong dự án có sẵn rồi bấm <b>Create</b>.</li>
        <li>Bấm biểu tượng <b>copy</b> để sao chép dãy key vừa tạo.</li>
        <li>Quay lại đây, <b>dán key vào ô "Gemini API key"</b> rồi dùng như bình thường.</li>
      </ol>
      <p class="note">🔒 Key này như mật khẩu riêng của thầy — đừng chia sẻ cho người khác. Nếu lỡ lộ, vào lại trang trên để xóa key cũ và tạo key mới.</p>
      </details>
      <label><b>Gemini API key:</b></label><br>
      <input type="password" id="gKey" placeholder="Dán key vào đây..." value="${esc(key)}"><br>
      <label><b>Ý tưởng / chủ đề:</b></label>
      <textarea id="gIdea" placeholder="VD: Ôn tập về thông tin trên trang web cho học sinh lớp 4, gồm siêu liên kết, bộ lọc 3 Có, thông tin riêng tư"></textarea><br>
      <label><b>Số câu:</b></label><br>
      <select id="gCount" style="max-width:160px"><option>3</option><option selected>5</option><option>10</option></select><br>
      <button class="btn big purple" id="gBtn" onclick="aiGenerate()">✨ Sinh câu hỏi</button>
      <div id="gOut" style="margin-top:12px"></div>
    </div>`;
}
async function aiGenerate(){
  const key=document.getElementById("gKey").value.trim();
  const idea=document.getElementById("gIdea").value.trim();
  const n=document.getElementById("gCount").value;
  if(!key){ alert("Thầy dán Gemini API key vào trước nhé!"); return; }
  if(!idea){ alert("Thầy nhập ý tưởng/chủ đề đã nhé!"); return; }
  localStorage.setItem("gemini_key",key);
  const out=document.getElementById("gOut"), btn=document.getElementById("gBtn");
  btn.disabled=true; out.innerHTML=`<p><span class="spin"></span> AI đang soạn ${n} câu hỏi...</p>`;
  const prompt=`Bạn là trợ lý soạn câu hỏi trắc nghiệm cho giáo viên tiểu học Việt Nam.
Dựa vào ý tưởng sau, hãy tạo đúng ${n} câu hỏi cho học sinh tiểu học (tiếng Việt đơn giản, mỗi câu có 1 đáp án đúng duy nhất).
Ý tưởng: ${idea}
Mỗi câu thuộc 1 trong 4 dạng (trộn đều các dạng cho sinh động):
- "choice": trắc nghiệm 4 đáp án (đáp án nhiễu phải hợp lý, dễ nhầm).
- "truefalse": câu đúng/sai (options luôn là ["Đúng","Sai"]).
- "reorder": sắp xếp thứ tự — options là 4 mục theo ĐÚNG thứ tự (VD: các bước thực hiện, quy trình), correct luôn là 0.
- "fillblank": điền từ — q chứa chỗ trống "...", options là 1-3 đáp án được chấp nhận (kể cả cách viết không dấu), correct luôn là 0.
Với mỗi câu, đề xuất thêm "image_prompt" (tiếng Anh, ngắn gọn) để vẽ ảnh minh họa KHÔNG có chữ.
Trả về DUY NHẤT một JSON hợp lệ, không thêm lời dẫn hay giải thích:
{"questions":[{"type":"choice","q":"...","options":["...","...","...","..."],"correct":2,"explain":"...","image_prompt":"..."},{"type":"reorder","q":"Xếp đúng thứ tự...?","options":["Bước 1","Bước 2","Bước 3","Bước 4"],"correct":0,"explain":"...","image_prompt":"..."},{"type":"fillblank","q":"... là ...","options":["Đáp án","Dap an"],"correct":0,"explain":"...","image_prompt":"..."}]}`;
  try{
    let j=null, lastErr="";
    const maxTok=Math.min(8000, parseInt(n)*600);
    for(let mi=0; mi<GEMINI_MODELS.length; mi++){ // thử lần lượt, model nào rảnh thì dùng
      const model=GEMINI_MODELS[mi];
      out.innerHTML=`<p><span class="spin"></span> AI đang soạn ${n} câu hỏi...<br><span class="note">(đang kết nối máy chủ ${mi+1}/${GEMINI_MODELS.length})</span></p>`;
      try{
        const ctl=new AbortController();
        const tmr=setTimeout(()=>ctl.abort(), 25000); // mỗi model chờ tối đa 25 giây
        const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`,
          {method:"POST",headers:{"Content-Type":"application/json"},signal:ctl.signal,
           body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.7,maxOutputTokens:maxTok}})});
        clearTimeout(tmr);
        const jj=await r.json();
        if(!r.ok) throw new Error(jj.error&&jj.error.message?jj.error.message:("Lỗi "+r.status));
        j=jj; break;
      }catch(e){ lastErr=(e.name==="AbortError")?"Máy chủ AI phản hồi quá chậm":e.message; }
    }
    if(!j) throw new Error(lastErr||"AI đang bận, thầy thử lại sau ít phút nhé!");
    let txt=j.candidates[0].content.parts.map(p=>p.text||"").join("");
    txt=txt.replace(/```json|```/g,"").trim();
    const data=JSON.parse(txt);
    const TYPES=["choice","truefalse","reorder","fillblank"];
    aiResult=(data.questions||[]).map(x=>{
      const t=TYPES.includes(x.type)?x.type:"choice";
      let options;
      if(t==="truefalse") options=["Đúng","Sai"];
      else if(t==="fillblank") options=Array.isArray(x.options)?x.options.map(String).filter(o=>o.trim()):[];
      else options=Array.isArray(x.options)?x.options.map(String):[];
      return {type:t, q:String(x.q||""), options,
        correct:t==="choice"?Math.max(0,parseInt(x.correct)||0):0, explain:String(x.explain||""), image_url:"",
        image_prompt:String(x.image_prompt||""), keep:true};
    }).filter(x=>x.q&&x.options.length>0&&(x.type==="fillblank"||x.type==="truefalse"||(x.options.length===4&&x.options.every(o=>o.trim()))));
    if(!aiResult.length) throw new Error("AI không trả về câu hỏi nào.");
    SFX.correct(); aiPreview();
  }catch(e){ out.innerHTML=`<div class="cfgwarn">⚠️ ${esc(e.message)}<br><span class="note">Kiểm tra lại API key và mạng rồi thử lại nhé thầy.</span></div>`; }
  btn.disabled=false;
}
function aiPreview(){
  const out=document.getElementById("gOut");
  const rows=aiResult.map((q,i)=>`<label><input type="checkbox" ${q.keep?"checked":""} onchange="aiResult[${i}].keep=this.checked" style="width:20px;height:20px">
    ${typeTag(q)} <b>Câu ${i+1}:</b> ${esc(q.q)}<br>
    <span class="note">${q.options.map((o,j)=>`${j===q.correct?"✅":"▫️"} ${esc(o)}`).join(" &nbsp; ")}</span>
    ${q.image_prompt?`<span class="imgprompt">🎨 Gợi ý ảnh: ${esc(q.image_prompt)} <br>→ Gửi prompt này vào chat với trợ lý để vẽ ảnh minh họa.</span>`:""}
  </label>`).join("");
  const setOpts=bank.filter(s=>!isDefaultSet(s)).map(s=>`<option value="${s.id}">${esc(s.set_name)}</option>`).join("");
  out.innerHTML=`<div class="aiprev"><h3>👀 Thầy duyệt câu hỏi (${aiResult.length} câu):</h3>${rows}
    <label><b>Lưu vào bộ đề:</b></label><br>
    <select id="aiSet">${setOpts}<option value="__new">➕ Tạo bộ đề mới...</option></select>
    <input type="text" id="aiNewName" placeholder="Tên bộ đề mới..." style="display:none"><br>
    <button class="btn big green" onclick="aiSave()">💾 Lưu các câu đã tick</button></div>`;
  document.getElementById("aiSet").onchange=e=>{
    document.getElementById("aiNewName").style.display=e.target.value==="__new"?"block":"none"; };
}
async function aiSave(){
  if(bankReadOnly){ alert("Thầy chạy file supabase-v2-migration.sql trong SQL Editor trước nhé!"); return; }
  const kept=aiResult.filter(q=>q.keep).map(({keep,image_prompt,...rest})=>rest);
  if(!kept.length){ alert("Thầy tick chọn ít nhất 1 câu nhé!"); return; }
  let sid=document.getElementById("aiSet").value;
  if(sid==="__new"){
    const nm=document.getElementById("aiNewName").value.trim()||"Bộ đề AI "+new Date().toLocaleDateString("vi-VN");
    const {data}=await sb.from("question_bank").insert({set_name:nm,questions:[]}).select().single();
    if(!data){ alert("Không lưu được. Kiểm tra mạng nhé thầy!"); return; }
    bank.push(data); sid=data.id;
  }
  const s=bank.find(x=>x.id===sid);
  if(isDefaultSet(s)){ alert("📌 Không thể lưu vào bộ đề mặc định. Thầy chọn bộ đề khác hoặc tạo bộ mới nhé!"); return; }
  s.questions=s.questions.concat(kept);
  if(!String(sid).startsWith("fb")) await sb.from("question_bank").update({questions:s.questions}).eq("id",sid);
  SFX.fanfare(); fireworks(5);
  document.getElementById("gOut").innerHTML=`<div class="aimsg">✅ Đã lưu ${kept.length} câu vào bộ đề <b>${esc(s.set_name)}</b>!</div>`;
}
</script>

<script>
/* ================= GIÁO VIÊN: ĐIỀU KHIỂN PHÒNG ================= */
let lockedOnce=false;
function unsubAll(){ [channel,channel2,channel3].forEach(c=>{try{c&&c.unsubscribe()}catch(e){}}); channel=channel2=channel3=null; if(timerInt){clearInterval(timerInt);timerInt=null;} if(window._bossIntroTO){clearTimeout(window._bossIntroTO);window._bossIntroTO=null;} if(window._bossAdvTO){clearTimeout(window._bossAdvTO);window._bossAdvTO=null;} }
async function tCreateRoom(){
  SFX.click();
  const sid=document.getElementById("setSel").value;
  const s=bank.find(x=>x.id===sid);
  if(!s||!s.questions.length){ alert("Bộ đề này chưa có câu hỏi. Thầy thêm trong tab Ngân hàng nhé!"); return; }
  unsubAll();
  let pin="";
  for(let t=0;t<20;t++){ pin=String(Math.floor(100000+Math.random()*900000));
    const {data}=await sb.from("rooms").select("id").eq("pin",pin).limit(1);
    if(!data||!data.length) break; }
  const theme=canAdventure()?roomTheme:"classic";
  const mode=canAuto()?(roomMode||"live"):"live"; // trial/ẩn danh luôn chơi trực tiếp
  const examMin=mode==="exam"?parseInt(((document.getElementById("examMin")||{}).value||"30"),10):null;
  let res=await sb.from("rooms").insert({pin,phase:"lobby",current:0,question_set:s.questions,theme,mode,exam_minutes:examMin}).select().single();
  if(res.error&&/exam_minutes/i.test(res.error.message||"")){
    // chưa chạy migration v7 (thiếu cột exam_minutes) → tạo phòng không có cột này, mặc định 30 phút
    res=await sb.from("rooms").insert({pin,phase:"lobby",current:0,question_set:s.questions,theme,mode}).select().single();
  }
  if(res.error&&/theme|mode/i.test(res.error.message||"")){
    // chưa chạy migration v4/v5 (thiếu cột theme/mode) → tạo phòng kiểu cũ
    res=await sb.from("rooms").insert({pin,phase:"lobby",current:0,question_set:s.questions}).select().single();
  }
  const {data,error}=res;
  if(error){ alert("Lỗi tạo phòng: "+error.message); return; }
  if(mode==="auto"&&data&&data.mode!=="auto"){
    alert("⚠️ Thầy chạy file supabase-v5-migration.sql trong SQL Editor rồi tạo lại phòng để dùng chế độ Tự động nhé!");
  }
  if(mode==="exam"&&data&&data.mode!=="exam"){
    alert("⚠️ Thầy chạy file supabase-v5-migration.sql trong SQL Editor rồi tạo lại phòng để dùng chế độ Kiểm tra nhé!");
  }
  room=data; players=[]; answers=[]; lockedOnce=false; roomAnsAll=[]; streakMap={}; bossReset();
  bossOn=(document.getElementById("bossOn")||{}).checked!==false;
  SFX.join(); tLobby();
}
function showTeacherRejoin(){
  app.innerHTML=`<div class="card"><h2>🔑 Vào lại phòng cũ</h2>
    <input type="text" id="rePin" inputmode="numeric" placeholder="Nhập PIN..." maxlength="6">
    <br><button class="btn big green" onclick="tRejoin()">Vào phòng</button>
    <button class="btn" onclick="showTeacher()">← Quay lại</button></div>`;
}
async function tRejoin(){
  const pin=document.getElementById("rePin").value.trim();
  const {data}=await sb.from("rooms").select("*").eq("pin",pin).order("created_at",{ascending:false}).limit(1);
  if(!data||!data.length){ alert("Không tìm thấy phòng với PIN này!"); return; }
  unsubAll(); room=data[0]; lockedOnce=false; roomAnsAll=[]; streakMap={}; bossReset(); bossOn=true;
  const {data:pl}=await sb.from("players").select("*").eq("room_id",room.id).order("created_at");
  players=pl||[];
  if(room.phase==="lobby") tLobby();
  else if(room.phase==="boss"||room.phase==="bossintro"){ bossMode=room.mode||"live"; bossPlayed=true; tBossResume(); }
  else if(room.phase==="stage") tStageScreen();
  else if(room.phase==="question"){ const m=room.mode||"live"; if(m==="auto") tAutoDash(); else if(m==="exam") tExamDash(); else tQuestion(); }
  else if(room.phase==="reveal") tShowReveal();
  else tPodium();
}
function tLobby(){
  LobbyMusic.start(); applyTheme();
  const adv=document.body.dataset.gtheme==="adventure";
  const n=room.question_set.length;
  const journey=adv?`<h3>🗺️ Bản đồ nhiệm vụ</h3>
    <div class="journey"><span class="jflag">🏁</span>${Array.from({length:n},(_,i)=>`<span class="jlink"></span><span class="jstop">${i+1}</span>`).join("")}<span class="jlink"></span><span class="jflag">🏆</span></div>
    <div class="jcap">${n} chặng thám hiểm đang chờ biệt đội!</div>`:"";
  const subHtml=adv?"Thám hiểm viên mở link game rồi nhập <b>mật mã</b> này!"
    :`Học sinh mở <b>${esc(location.host+location.pathname)}</b> rồi nhập PIN này`;
  app.innerHTML=`<div class="card">
    <h2>${adv?"🧭 Mật mã lên đường":"🔑 Mã PIN phòng"}</h2><div class="pin">${room.pin}</div>
    <p class="sub">${subHtml}</p>
    ${journey}
    ${(room.mode||"live")==="exam"?"":`<h3>🗺️ Nhiệm vụ theo chặng</h3>${stageMapHtml(-1,n)}`}
    <h3>🎒 Đã vào: <span id="pcount">0</span> bạn</h3>
    <div class="plist" id="plist"></div><br>
    <button class="btn big green" id="startBtn" onclick="tStartGame()" disabled>▶ Bắt đầu (chờ học sinh...)</button><br>
    <button class="btn small" id="lobbyMusicBtn" onclick="toggleLobbyMusic()">🎵 Nhạc chờ: Bật</button>
  </div>`;
  const render=async()=>{
    const {data}=await sb.from("players").select("*").eq("room_id",room.id).order("created_at");
    players=data||[];
    const pl=document.getElementById("plist"); if(pl) pl.innerHTML=players.map(p=>`<span class="pname">${esc(p.name)}${pcls(p)}</span>`).join("");
    const pc=document.getElementById("pcount"); if(pc) pc.textContent=players.length;
    const b=document.getElementById("startBtn"); if(b){ b.disabled=!players.length; b.innerHTML=players.length?"▶ Bắt đầu!":"▶ Bắt đầu (chờ học sinh...)"; }
  };
  render();
  channel2=sb.channel("tpl-"+room.id)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"players",filter:"room_id=eq."+room.id},()=>{ render(); SFX.join(); })
    .subscribe();
}
async function tStartQ(){
  SFX.click(); unsubAll(); LobbyMusic.stop();
  const N=room.question_set.length;
  if(isAdv()&&N>0){ // Phiêu lưu: hiện màn hình Chặng 1 trước câu đầu
    await sb.from("rooms").update({phase:"stage",current:0,question_started_at:new Date().toISOString()}).eq("id",room.id);
    room.phase="stage"; room.current=0; room.question_started_at=new Date().toISOString();
    tStageScreen(); return;
  }
  await sb.from("rooms").update({phase:"question",current:0,question_started_at:new Date().toISOString()}).eq("id",room.id);
  room.phase="question"; room.current=0; room.question_started_at=new Date().toISOString();
  tQuestion();
}
function tQuestion(){
  const q=qNow(); if(!q) return; applyTheme();
  const idx=room.current, total=room.question_set.length;
  const letters=["A","B","C","D"], order=optOrder(q);
  const typeNote=q.type==="truefalse"?"• Dạng Đúng/Sai":q.type==="reorder"?"• 🔢 Xếp đúng thứ tự":q.type==="fillblank"?"• ✏️ Điền từ":"";
  const optsHtml=q.type==="fillblank"
    ? `<p class="sub">✏️ Học sinh điền đáp án vào ô trống trên máy của mình</p>`
    : `<div class="opts">${order.map((oi,d)=>`<div class="opt dim">${letters[d]||"•"}. ${esc(q.options[oi])}</div>`).join("")}</div>`;
  app.innerHTML=`<div class="card">
    <div class="note">Câu ${idx+1}/${total} ${typeNote}</div>
    <div class="timer" id="tmr">${QUESTION_TIME}</div>
    <div class="qtext">${esc(q.q)}</div>${qImg(q)}
    ${optsHtml}
    <p class="sub">✅ Đã trả lời: <b id="acount">0</b> / ${players.length} bạn</p>
    <button class="btn big red" onclick="tLock()">⏹ Chốt đáp án</button>
  </div>`;
  lastTick=99; locking=false;
  if(timerInt) clearInterval(timerInt);
  timerInt=setInterval(()=>{ const r=remain(); const e=document.getElementById("tmr");
    if(e){ e.textContent=r; e.classList.toggle("warn",r<=5); }
    if(r<=5&&r!==lastTick&&r>0){ lastTick=r; SFX.urgent(); }
    if(r<=0&&!locking){ locking=true; tLock(); }
  },250);
  channel2=sb.channel("tans-"+room.id+"-"+idx)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"answers",filter:"room_id=eq."+room.id},async()=>{
      const {count}=await sb.from("answers").select("id",{count:"exact",head:true}).eq("room_id",room.id).eq("q_index",idx);
      const e=document.getElementById("acount"); if(e) e.textContent=count||0;
    }).subscribe();
}
async function tLock(){
  if(lockedOnce) return; lockedOnce=true;
  if(timerInt){ clearInterval(timerInt); timerInt=null; }
  SFX.click();
  const idx=room.current, q=qNow();
  await new Promise(r=>setTimeout(r,1200)); // cho dap an cuoi giay cua HS ve kip truoc khi chot
  let {data:ans}=await sb.from("answers").select("*").eq("room_id",room.id).eq("q_index",idx);
  if(!ans||!ans.length){ await new Promise(r=>setTimeout(r,3000)); // chua co dap an nao: doi them 1 luot roi doc lai
    const r2=await sb.from("answers").select("*").eq("room_id",room.id).eq("q_index",idx); ans=r2.data||[]; }
  answers=ans||[];
  try{ const r=await sb.from("answers").select("player_id,q_index,is_correct").eq("room_id",room.id); roomAnsAll=r.data||[]; }catch(e){}
  const pmap={}; players.forEach(p=>pmap[p.id]=p);
  streakMap={};
  for(const p of players) streakMap[p.id]=streakOf(roomAnsAll.filter(x=>x.player_id===p.id),idx);
  for(const a of answers){
    if(!pmap[a.player_id]) continue;
    const bonus=Math.max(0,Math.round(50*(1-a.ms/(QUESTION_TIME*1000))));
    const combo=comboBonus(streakMap[a.player_id]||0);
    if(q.type==="reorder"){
      const frac=Math.max(0,Math.min(1,(a.option_index||0)/q.options.length));
      if(frac>0) pmap[a.player_id].score+=Math.round(100*frac)+(a.is_correct?bonus+combo:0);
    } else if(a.is_correct){
      pmap[a.player_id].score+=100+bonus+combo;
    }
  }
  for(const p of players) await sb.from("players").update({score:p.score}).eq("id",p.id);
  await sb.from("rooms").update({phase:"reveal"}).eq("id",room.id);
  room.phase="reveal";
  tShowReveal();
}
async function tShowReveal(){
  const q=qNow(); if(!q) return; applyTheme();
  await ensureAnsAll();
  const idx=room.current;
  try{
    const {data}=await sb.from("answers").select("*").eq("room_id",room.id).eq("q_index",idx);
    answers=data||[];
  }catch(e){}
  const total=room.question_set.length;
  const letters=["A","B","C","D"], last=idx>=total-1, order=optOrder(q);
  let resultHtml="";
  if(q.type==="reorder"){
    const full=answers.filter(a=>a.is_correct).length;
    const part=answers.length-full;
    resultHtml=`<div class="qtext" style="font-size:1.3rem">Thứ tự đúng:<br><b>${q.options.map((o,i)=>`${i+1}. ${esc(o)}`).join("<br>")}</b></div>
    <h3>📊 Kết quả</h3>
    <div class="bar right" onclick="tWhoPicked(0,'rofull')" style="cursor:pointer"><div style="width:${answers.length?Math.max(8,Math.round(full/answers.length*100)):8}%">🎯 Đúng hoàn toàn: ${full}/${answers.length}</div></div>
    ${part?`<p class="note" onclick="tWhoPicked(0,'ropart')" style="cursor:pointer;text-decoration:underline">💪 ${part} bạn đúng một phần — bấm để xem tên</p>`:""}
    <p class="note">Điểm tính theo số vị trí đúng (mỗi vị trí = ${Math.round(100/q.options.length)} điểm).</p>
    <div id="whoBox"></div>`;
  } else if(q.type==="fillblank"){
    const full=answers.filter(a=>a.is_correct).length;
    const wrong=answers.length-full;
    resultHtml=`<div class="qtext" style="font-size:1.3rem">Đáp án được chấp nhận: <b>${q.options.map(o=>esc(o)).join(" / ")}</b></div>
    <h3>📊 Kết quả</h3>
    <div class="bar right" onclick="tWhoPicked(0,'blfull')" style="cursor:pointer"><div style="width:${answers.length?Math.max(8,Math.round(full/answers.length*100)):8}%">🎯 Trả lời đúng: ${full}/${answers.length}</div></div>
    ${wrong?`<p class="note" onclick="tWhoPicked(0,'blwrong')" style="cursor:pointer;text-decoration:underline">😅 ${wrong} bạn chưa đúng — bấm để xem tên</p>`:""}
    <div id="whoBox"></div>`;
  } else {
    const counts=q.options.map((_,i)=>answers.filter(a=>a.option_index===i).length);
    const maxC=Math.max(1,...counts);
    resultHtml=`<div class="opts">${order.map((oi,d)=>`<div class="opt ${oi===q.correct?"correct":""}" onclick="tWhoPicked(${oi},'choice')" style="cursor:pointer">${oi===q.correct?"✅":"▫️"} ${letters[d]||"•"}. ${esc(q.options[oi])}</div>`).join("")}</div>
    <h3>📊 Cả lớp đã chọn</h3>
    ${order.map((oi,d)=>`<div class="bar ${oi===q.correct?"right":""}" onclick="tWhoPicked(${oi},'choice')" style="cursor:pointer"><div style="width:${Math.max(8,Math.round(counts[oi]/maxC*100))}%">${letters[d]||"•"}: ${counts[oi]}</div></div>`).join("")}
    <p class="note">👆 Bấm vào đáp án để xem tên các bạn đã chọn.</p>
    <div id="whoBox"></div>`;
  }
  app.innerHTML=`<div class="card">
    <div class="note">Câu ${idx+1}/${total} — Kết quả (${answers.length} bạn đã trả lời)</div>
    <div class="qtext">${esc(q.q)}</div>${qImg(q)}
    ${resultHtml}
    ${journeyHtml()}
    ${stageMapHtml(idx,total)}
    ${stageDoneBanner(idx,total)}
    ${q.explain?`<div class="explain">💡 ${esc(q.explain)}</div>`:""}
    <h3>🏅 Bảng điểm</h3><div id="scoreWrap">${scoreTable()}</div>
    <button class="btn big green" onclick="tNext()">${last?"🏁 Xem vinh danh":"Câu tiếp theo ➡"}</button>
  </div>`;
  // Theo dõi vòng quay may mắn của HS: điểm tăng trong lúc chốt = vừa quay trúng
  try{ channel3&&channel3.unsubscribe(); }catch(e){}
  channel3=sb.channel("tspin-"+room.id+"-"+idx)
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"players",filter:"room_id=eq."+room.id},payload=>{
      const p=players.find(x=>x.id===payload.new.id); if(!p) return;
      const delta=payload.new.score-p.score; p.score=payload.new.score;
      if(delta>0){
        const w=document.getElementById("scoreWrap"); if(w) w.innerHTML=scoreTable();
        toast(`🎡 <b>${esc(p.name)}</b> quay may mắn +${delta} điểm!`);
        SFX.fanfare();
      }
    }).subscribe();
}
function scoreTable(){
  const s=[...players].sort((a,b)=>b.score-a.score);
  if(!s.length) return `<p class="note">Chưa có học sinh.</p>`;
  const N=room?room.question_set.length:0;
  return `<table class="score">${s.map((p,i)=>{ const st=streakMap[p.id]||0;
    return `<tr><td>${i+1}</td><td style="text-align:left"><b>${esc(p.name)}</b>${pcls(p)}${st>=2?` <span class="streak">🔥x${st}</span>`:""}</td><td><b>${p.score}</b> đ</td><td>🪙 ${coinsFor(p.id,roomAnsAll,N,bossWon)}</td></tr>`; }).join("")}</table>`;
}
async function tNext(){
  SFX.click(); lockedOnce=false;
  const total=room.question_set.length;
  if(room.current>=total-1){
    if(bossOn){ startBoss("live"); return; }
    await sb.from("rooms").update({phase:"podium"}).eq("id",room.id);
    room.phase="podium"; tPodium();
  }else{
    const nx=room.current+1;
    unsubAll();
    if(isAdv()&&stageOfIdx(nx,total)>stageOfIdx(room.current,total)){ // Phiêu lưu: sang chặng mới -> màn hình chặng
      await sb.from("rooms").update({phase:"stage",current:nx,question_started_at:new Date().toISOString()}).eq("id",room.id);
      room.current=nx; room.phase="stage"; room.question_started_at=new Date().toISOString();
      tStageScreen();
    }else{
      await sb.from("rooms").update({phase:"question",current:nx,question_started_at:new Date().toISOString()}).eq("id",room.id);
      room.current=nx; room.phase="question"; room.question_started_at=new Date().toISOString();
      tQuestion();
    }
  }
}
function tPodium(){
  unsubAll(); applyTheme();
  const advT=document.body.dataset.gtheme==="adventure";
  const s=[...players].sort((a,b)=>b.score-a.score);

async function startBoss(m){
  bossMode=m||(room.mode||"live"); bossPlayed=true; bossWon=false; bossResults=[];
  unsubAll(); window._bossAdvBusy=false;
  if(window._bossIntroTO){ clearTimeout(window._bossIntroTO); window._bossIntroTO=null; }
  const {data}=await sb.from("answers").select("player_id,q_index,is_correct").eq("room_id",room.id);
  bossQs=bossPickQs(data||[], room.question_set.length);
  bossHp=100; bossIdx=0;
  // Man hinh chao boss (3 giay, ca thay + HS) roi moi vao cau boss 1 — dong ho chi chay khi vao cau hoi
  await sb.from("rooms").update({phase:"bossintro",current:0}).eq("id",room.id);
  room.phase="bossintro"; room.current=0;
  applyTheme(); app.innerHTML=bossIntroHtml(); SFX.fanfare();

async function tBossResume(){ // thầy vào lại phòng cũ đang ở giữa trận boss: dựng lại từ answers
  bossMode=room.mode||"live"; bossPlayed=true;

  const all=data||[];
  bossQs=bossPickQs(all, room.question_set.length);
  bossIdx=room.current||0; bossHp=bossHpAfter(all,bossIdx); bossResults=[];
  for(let k=0;k<bossIdx;k++){ const d=bossDmgFor(all,k); bossResults.push({k,qi:bossQs[k],correct:d.correct,total:d.total,dmg:d.dmg,hp:bossHpAfter(all,k+1)}); }

async function tBossLock(){
  if(bossLocked) return;
  // Thay bam "Chot don" khi dong ho van con gio: hoi lai de khoi chot truoc khi HS kip tra loi
  // (dong ho het gio tu dong goi thi remain()=0 nen khong hoi).
  if(remain()>3&&!window._bossLockOk){ askConfirm("Đồng hồ vẫn còn "+remain()+" giây. Thầy chắc chắn muốn chốt đòn ngay bây giờ?",()=>{ window._bossLockOk=true; tBossLock(); }); return; }
  window._bossLockOk=false;
  bossLocked=true;
  if(timerInt){ clearInterval(timerInt); timerInt=null; }
  SFX.click();
  await new Promise(r=>setTimeout(r,1500)); // cho dap an cuoi giay cua HS ve kip truoc khi chot
  let {data}=await sb.from("answers").select("*").eq("room_id",room.id).eq("q_index",BOSS_QBASE+bossIdx);
  if(!data||!data.length){ await new Promise(r=>setTimeout(r,3000)); // chua co dap an nao: doi them 1 luot roi doc lai, tranh chot truot dap an dang tren duong ve
    const r2=await sb.from("answers").select("*").eq("room_id",room.id).eq("q_index",BOSS_QBASE+bossIdx); data=r2.data||[]; }
  const rows=data||[]; const correct=rows.filter(a=>a.is_correct).length;
  const dmg=rows.length?Math.round(correct/rows.length*35):0;
  bossHp=Math.max(0,bossHp-dmg);
  bossResults.push({k:bossIdx,qi:bossQs[bossIdx],correct,total:rows.length,dmg,hp:bossHp});
  bossWon=bossHp<=0;
  const last=bossIdx>=bossQs.length-1;
  app.innerHTML=`<div class="card">
    <h2>⚔️ Kết quả đòn đánh</h2>
    <p class="sub">Câu boss ${bossIdx+1}: <b>${correct}/${rows.length}</b> bạn trả lời đúng → gây <b>${dmg}</b> sát thương</p>
    <div class="bossbar"><div style="width:${bossHp}%"></div></div>
    <p class="sub">👹 Trùm Virus còn <b>${bossHp}/100</b> máu</p>
    ${bossWon?`<div class="stagebanner">🎉 Cả lớp đã đánh bại 👹 Trùm Virus! +30 Xu 🪙 mỗi bạn</div>`:last?`<div class="stagebanner">😄 Trùm Virus chạy trốn vì hết giờ! Lần sau cả lớp cố gắng hơn nhé 💪</div>`:""}

  if(window._bossAdvTO) clearTimeout(window._bossAdvTO);
  window._bossAdvTO=setTimeout(()=>{ window._bossAdvTO=null; tBossNext(); },3500);
}

async function tExportExcel(){
  if(!canAuto()){ showUpgradeModal("\uD83D\uDCE5 Xuất Excel"); return; }
  SFX.click();
  const qs=room.question_set, N=qs.length, letters=["A","B","C","D"];
  const isExam=(room.mode||"live")==="exam"; // kiểm tra: điểm thang 10, đáp án mỗi bạn đảo khác nhau → xuất nội dung đáp án, không xuất chữ cái
  const ansBy={}; autoAns.forEach(a=>{ (ansBy[a.player_id]=ansBy[a.player_id]||{})[a.q_index]=a; });
  const corr=id=>{ const m=ansBy[id]||{}; let c=0; for(let qi=0;qi<N;qi++) if(m[qi]&&m[qi].is_correct) c++; return c; };
  const s=[...players].sort((a,b)=> isExam ? (corr(b.id)-corr(a.id)) : (b.score-a.score));
  const head1=["STT","Họ tên","Lớp",isExam?"Điểm số /10":"Điểm số","Số câu đúng","Số câu sai","Tỉ lệ đúng (%)","Xếp hạng"];
  const rows1=s.map((p,i)=>{ const c=corr(p.id);
    return [i+1,p.name,p.class_name||"",isExam?(c*10/N).toFixed(1):p.score,c,N-c,N?Math.round(c/N*100):0,i+1]; });
  const head2=["Họ tên","Lớp","Điểm số",...qs.map((q,qi)=>`Câu ${qi+1}`)];
  const rows2=s.map(p=>{ const m=ansBy[p.id]||{}; const sc=isExam?(corr(p.id)*10/N).toFixed(1):p.score;
    const cells=qs.map((q,qi)=>{ const a=m[qi]; if(!a) return "—";
      if(q.type==="reorder"){ const cc=a.option_index||0; return (a.is_correct?"✅ ":"⚠️ ")+cc+"/"+q.options.length+" vị trí"; }
      if(q.type==="fillblank") return a.is_correct?"✅ Đúng":"❌ Sai";
      if(isExam) return (a.is_correct?"✅ ":"❌ ")+String(q.options[a.option_index]||"").slice(0,30);
      const order=optOrder(q,qi);
      const disp=letters[order.indexOf(a.option_index)]||"•";
      return (a.is_correct?"✅ ":"❌ ")+disp+". "+String(q.options[a.option_index]||"").slice(0,30);
    });
    return [p.name,p.class_name||"",sc,...cells]; });
  const fname=`Ket-qua_${room.pin}_${new Date().toISOString().slice(0,10)}.xlsx`;
  try{
    if(window.XLSX){
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([head1,...rows1]),"Kết quả");
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([head2,...rows2]),"Chi tiết từng câu");
      XLSX.writeFile(wb,fname);
    } else throw new Error("no xlsx");
  }catch(e){
    const csv="﻿"+[head1,...rows1].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
    const el=document.createElement("a");
    el.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
    el.download=fname.replace(/\.xlsx$/,".csv"); el.click();
    setTimeout(()=>URL.revokeObjectURL(el.href),5000);
  }
  toast("📥 Đã xuất file kết quả!");
}

/* ================= CHẾ ĐỘ KIỂM TRA — phía thầy =================
   HS làm bài theo nhịp riêng như chế độ Tự động, nhưng khác ở:
   - thứ tự câu hỏi + đáp án đảo RIÊNG từng bạn (seed theo player.id)
   - có đồng hồ đếm ngược chung (exam_minutes, mặc định 30 phút)

   - đáp án được đẩy lên máy chủ ngay khi HS trả lời (upsert) nên máy thầy thấy tiến độ trực tiếp */
let examAns=[], examTmrInt=null;
function examDeadlineMs(){

function examRemainStr(){

  const s=Math.max(0,Math.floor((dl-Date.now())/1000));
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
async function tExamStart(){
  SFX.click(); unsubAll(); LobbyMusic.stop();
  await sb.from("rooms").update({phase:"question",question_started_at:new Date().toISOString()}).eq("id",room.id);
  room.phase="question"; room.question_started_at=new Date().toISOString(); tExamDash();
}
async function tExamDash(){
  applyTheme();
  try{ const {data}=await sb.from("answers").select("*").eq("room_id",room.id); examAns=data||[]; }catch(e){ examAns=[]; }
  let ended=false;
  const render=()=>{
    const total=room.question_set.length;
    const doneQ=p=>new Set(examAns.filter(a=>a.player_id===p.id).map(a=>a.q_index)).size;
    const finCount=players.filter(p=>doneQ(p)>=total).length;
    const subCount=players.filter(p=>p.exam_done).length;
    const rows=players.map(p=>{
      const d=doneQ(p), done=p.exam_done;
      return `<tr><td style="text-align:left"><b>${esc(p.name)}</b>${pcls(p)}${done?" ✅":""}</td><td>${d}/${total}</td><td><b>${done?(p.score/100).toFixed(1):"—"}</b>${done?" /10":""}</td></tr>`;
    }).join("");
    app.innerHTML=`<div class="card">
      <h2>📝 Kiểm tra — đang làm bài</h2>
      <p class="sub">⏱️ Còn lại: <b id="examTmr">${examRemainStr()}</b> • <b>${finCount}/${players.length}</b> bạn đã làm hết câu • <b>${subCount}/${players.length}</b> bạn đã nộp bài</p>
      <table class="score"><tr><th style="text-align:left">Học sinh</th><th>Đã làm</th><th>Điểm /10</th></tr>
      ${rows||'<tr><td colspan="3" class="note">Chưa có học sinh.</td></tr>'}</table>
      <button class="btn big red" onclick="tExamEnd(false)">🏁 Kết thúc bài kiểm tra</button>
    </div>`;
  };
  render();
  if(examTmrInt) clearInterval(examTmrInt);
  examTmrInt=setInterval(()=>{ const e=document.getElementById("examTmr"); if(e) e.textContent=examRemainStr();
    if(!ended&&examDeadlineMs()&&Date.now()>=examDeadlineMs()){ ended=true; clearInterval(examTmrInt); examTmrInt=null; tExamEnd(true); } },1000);
  channel2=sb.channel("texam-"+room.id)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"answers",filter:"room_id=eq."+room.id},payload=>{ examAns.push(payload.new); render(); })
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"answers",filter:"room_id=eq."+room.id},payload=>{ const i=examAns.findIndex(a=>a.id===payload.new.id); if(i>=0) examAns[i]=payload.new; else examAns.push(payload.new); render(); })
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"players",filter:"room_id=eq."+room.id},payload=>{
      const p=players.find(x=>x.id===payload.new.id); if(p){ p.score=payload.new.score; if(payload.new.exam_done!=null) p.exam_done=payload.new.exam_done; } render(); })
    .subscribe();
}
function tExamEnd(auto){ if(auto){ tExamEndGo(); return; } askConfirm("Kết thúc bài kiểm tra? Bạn nào chưa nộp sẽ được tính theo số câu đã làm.",()=>tExamEndGo()); }
async function tExamEndGo(){
  SFX.click(); unsubAll();
  if(examTmrInt){ clearInterval(examTmrInt); examTmrInt=null; }
  await sb.from("rooms").update({phase:"podium"}).eq("id",room.id);
  room.phase="podium"; tExamResults();
}
async function tExamResults(){
  unsubAll(); applyTheme(); SFX.victory(); fireworks(8);
  try{ const {data}=await sb.from("answers").select("*").eq("room_id",room.id); examAns=data||[]; }catch(e){ examAns=[]; }
  autoAns=examAns; // để nút Xuất Excel dùng chung hàm tExportExcel
  try{ const {data}=await sb.from("players").select("*").eq("room_id",room.id); if(data&&data.length) players=data; }catch(e){}
  const N=room.question_set.length;
  const ansBy={}; examAns.forEach(a=>{ (ansBy[a.player_id]=ansBy[a.player_id]||{})[a.q_index]=a; });
  const nCorrect=id=>{ const m=ansBy[id]||{}; let c=0; for(let i=0;i<N;i++) if(m[i]&&m[i].is_correct) c++; return c; };
  const score10=p=>(nCorrect(p.id)*10/N).toFixed(1);
  const s=[...players].sort((a,b)=>nCorrect(b.id)-nCorrect(a.id));
  const step=(p,cls,md)=>p?`<div class="step ${cls}"><span class="medal">${md}</span><span class="nm">${esc(p.name)}${pcls(p)}</span><span class="sc">${score10(p)}/10</span></div>`:`<div class="step ${cls}"><span class="medal">—</span></div>`;
  app.innerHTML=`<div class="card">
    <h1>🏆 Kết quả bài kiểm tra</h1>
    <div class="podium">${step(s[1],"s2","🥈")}${step(s[0],"s1","🥇")}${step(s[2],"s3","🥉")}</div>
    <h3>🔟 Top 10</h3>
    <table class="score">${s.slice(0,10).map((p,i)=>`<tr><td>${i+1}</td><td style="text-align:left"><b>${esc(p.name)}</b>${pcls(p)}${p.exam_done?"":" <span class='note'>(chưa nộp)</span>"}</td><td><b>${score10(p)}/10</b></td><td>${nCorrect(p.id)}/${N} đúng</td></tr>`).join("")||'<tr><td colspan="4" class="note">Chưa có học sinh.</td></tr>'}</table>
    <h3>📊 Thống kê cả lớp</h3>
    <table class="score"><tr><th>#</th><th style="text-align:left">Tên</th><th>Điểm /10</th><th>Đúng</th><th>Sai</th><th>Tỉ lệ</th><th>Nộp bài</th></tr>
    ${s.map((p,i)=>{ const c=nCorrect(p.id); return `<tr><td>${i+1}</td><td style="text-align:left">${esc(p.name)}${pcls(p)}</td><td><b>${score10(p)}</b></td><td>${c}</td><td>${N-c}</td><td>${N?Math.round(c/N*100):0}%</td><td>${p.exam_done?"✅":"—"}</td></tr>`; }).join("")}</table>
    <button class="btn big green" onclick="tExportExcel()">📥 Xuất Excel</button><br>
    <button class="btn big" onclick="showTeacher()">🏠 Về trang giáo viên</button>
  </div>`;
}
</script>

<script>
/* ================= HỌC SINH ================= */
let sCur=-1;

    <p class="note">Hỏi thầy mã PIN đang hiện trên màn hình lớp nhé!<br>✍️ Ghi <b>họ và tên thật</b> (đầy đủ họ + tên, viết hoa chữ cái đầu) và <b>chọn đúng lớp</b> của em — không dùng biệt danh nhé!</p></div>`;
}
/* Kiểm tra tên học sinh đúng quy cách: họ tên thật, không nickname, không chữ vô nghĩa.
   Trả về {ok:true,name:Tên Đã Chuẩn Hóa} hoặc {ok:false,msg:lý do} */
function validateStudentName(raw){
  const name=(raw||"").replace(/\s+/g," ").trim();
  if(!name) return {ok:false,msg:"Em chưa nhập họ và tên!"};
  if(name.length<5) return {ok:false,msg:"Họ và tên hơi ngắn — em ghi đầy đủ họ và tên thật nhé!"};
  if(/[^A-Za-zÀ-ỹ ]/.test(name)) return {ok:false,msg:"Họ và tên chỉ gồm chữ cái thôi em — không dùng số, ký hiệu hay biểu tượng nhé!"};
  const words=name.split(" ");
  if(words.length<2) return {ok:false,msg:"Em ghi đầy đủ HỌ và TÊN (ít nhất 2 chữ) nhé — không ghi mỗi tên hay biệt danh!"};
  if(words.length>5) return {ok:false,msg:"Họ và tên dài quá — em ghi đúng họ tên thật của mình thôi nhé!"};
  const vowels="aăâeêioôơuưyáàảãạắằẳẵặấầẩẫậéèẻẽẹếềểễệíìỉĩịóòỏõọốồổỗộớờởỡợúùủũụứừửữựýỳỷỹỵđ";
  const banned=["asdf","qwer","zxcv","admin","test","hack","nick","clone"," acc","vip","pro","game","fake"];
  const low=" "+name.toLowerCase()+" ";
  for(const b of banned){ if(low.includes(b)) return {ok:false,msg:"Tên này giống biệt danh/tên đùa rồi — em ghi họ tên thật của mình nhé!"}; }
  for(const w of words){
    if(w.length<2) return {ok:false,msg:"Mỗi chữ trong họ tên phải có từ 2 chữ cái — em kiểm tra lại nhé!"};
    if(w.length>12) return {ok:false,msg:"Có chữ trong tên dài bất thường — em ghi lại đúng họ tên thật nhé!"};
    const lw=w.toLowerCase();
    if(![...lw].some(c=>vowels.includes(c))) return {ok:false,msg:"“"+w+"” không giống chữ tiếng Việt — em ghi họ tên thật nhé!"};
    if(new Set(lw).size===1) return {ok:false,msg:"“"+w+"” toàn chữ giống nhau — em ghi họ tên thật nhé!"};
    if(/(.)\1\1/.test(lw)) return {ok:false,msg:"“"+w+"” có chữ lặp bất thường — em ghi họ tên thật nhé!"};
  }
  const lowerWords=words.map(w=>w.toLowerCase());
  if(new Set(lowerWords).size===1) return {ok:false,msg:"Họ và tên không thể là các chữ giống hệt nhau — em ghi họ tên thật nhé!"};
  const proper=words.map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(" ");
  return {ok:true,name:proper};
}
/* Huy hiệu lớp cạnh tên học sinh, ví dụ: An <span>4/3</span> */
function pcls(p){ return p&&p.class_name?` <span class="pcls">${esc(p.class_name)}</span>`:""; }
function jErr(msg){ const e=document.getElementById("jErr"); if(e){ e.textContent="⚠️ "+msg; e.style.display="block"; e.scrollIntoView({block:"center",behavior:"smooth"}); } else alert(msg); }
async function sJoin(){
  const pin=document.getElementById("jPin").value.trim();
  const chk=validateStudentName(document.getElementById("jName").value);
  if(pin.length<4){ jErr("Em nhập mã PIN nhé!"); return; }
  if(!chk.ok){ jErr(chk.msg); return; }
  const name=chk.name;
  const grade=document.getElementById("jGrade").value, cnum=document.getElementById("jClassNum").value;
  if(!grade||!cnum){ jErr("Em chọn KHỐI và LỚP của mình nhé — chọn đúng lớp mới vào chơi được!"); return; }
  const className=grade+"/"+cnum;
  SFX.click();
  const {data}=await sb.from("rooms").select("*").eq("pin",pin).order("created_at",{ascending:false}).limit(1);
  if(!data||!data.length){ jErr("Không tìm thấy phòng! Kiểm tra lại PIN nhé."); return; }
  room=data[0];
  if(room.phase!=="lobby"){ jErr("Phòng này đã bắt đầu rồi. Em chờ ván sau nhé!"); return; }
  let res=await sb.from("players").insert({room_id:room.id,name,class_name:className}).select().single();
  if(res.error){ /* Máy chủ chưa có cột lớp (bản cũ) -> vào phòng bằng tên, không để HS bị kẹt */
    res=await sb.from("players").insert({room_id:room.id,name}).select().single();
    if(!res.error&&res.data) res.data.class_name=className;
  }
  const p=res.data, error=res.error;
  if(error){ jErr("Lỗi vào phòng: "+error.message); return; }
  myPlayer=p; sCur=-1; myAnswer=null; sAutoStarted=false; sExamStarted=false; sExamSubmitted=false; sBossCur=-1; sBossAnswered=false; sBossActive=false; SFX.join();
  subRoomStudent(); sLobby();
}
let sSyncInt=null;
async function sSyncRoom(manual){
  try{
    const {data}=await sb.from("rooms").select("phase,current,question_started_at,exam_minutes,mode").eq("id",room.id).single();
    let acted=false;
    if(data&&(data.phase!==room.phase||data.current!==room.current||(data.question_started_at&&data.question_started_at!==room.question_started_at)||(data.exam_minutes!=null&&data.exam_minutes!==room.exam_minutes))){
      room.phase=data.phase; room.current=data.current;
      if(data.question_started_at) room.question_started_at=data.question_started_at;
      if(data.exam_minutes!=null) room.exam_minutes=data.exam_minutes;
      if(data.mode) room.mode=data.mode;
      onRoomChange(); acted=true;
    }
    // Watchdog: phòng đã ở phase câu hỏi mà màn hình HS chưa vào câu hỏi (lỡ nhịp realtime / lần bắt đầu trước bị lỗi)
    // -> thử mở lại thay vì kẹt ở màn hình chờ vĩnh viễn
    if(room&&room.phase==="question"){
      if(sExamMode()&&!sExamStarted){ onRoomChange(); acted=true; }
      else if(sAutoMode()&&!sAutoStarted){ onRoomChange(); acted=true; }
      else if(!sAutoMode()&&!sExamMode()&&sCur!==room.current){ onRoomChange(); acted=true; }
    }
    if(manual) toast(acted?"✅ Đã đồng bộ!":"Không có gì mới — em chờ thầy nhé!");
  }catch(e){ if(manual) toast("⚠️ Mạng yếu, em thử lại nhé!"); }
}
function subRoomStudent(){
  channel=sb.channel("sroom-"+room.id)
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"rooms",filter:"id=eq."+room.id},payload=>{
      const nr=payload.new||{};
      // Gói realtime khi chỉ đổi phase có thể THIẾU cột lớn question_set -> giữ lại dữ liệu cũ, tuyệt đối không ghi đè mất bộ đề
      if(room){ if(!nr.question_set) nr.question_set=room.question_set; if(!nr.mode) nr.mode=room.mode; if(!nr.theme) nr.theme=room.theme; if(!nr.question_started_at&&room.question_started_at) nr.question_started_at=room.question_started_at; if(nr.exam_minutes==null&&room.exam_minutes!=null) nr.exam_minutes=room.exam_minutes; }
      room=nr; onRoomChange();
    }).subscribe();
  // phao cứu sinh: đồng bộ liên tục mỗi 5s đề phòng realtime rớt (wifi trường hay chập chờn)
  if(sSyncInt) clearInterval(sSyncInt);
  sSyncRoom(false);
  sSyncInt=setInterval(()=>sSyncRoom(false),5000);
  // máy vừa mở lại màn hình (ngủ/rớt foreground) thì đồng bộ ngay, khỏi chờ chu kỳ 5s
  if(!window._sVisHook){ window._sVisHook=true; document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&room&&myPlayer) sSyncRoom(false); }); }
}
function onRoomChange(){
  if(room.phase==="bossintro"){ sBossIntro(); return; }
  if(sExamMode()){
    if(room.phase==="question"){ if(!sExamStarted){ sExamStarted=true; sExamBeginSafe(); } }
    else if(room.phase==="podium"){ sExamPodium(); }
    return;
  }
  if(sAutoMode()){
    if(room.phase==="question"){ if(!sAutoStarted){ sAutoStarted=true; sAutoBeginSafe(); } }
    else if(room.phase==="boss"){ sBossQ(); }
    else if(room.phase==="podium"){ sAutoPodium(); }
    return;
  }
  if(room.phase==="stage"){ sStageScreen(); return; }
  if(room.phase==="boss"){ sBossQ(); return; }
  if(room.phase==="question"){
    if(sCur!==room.current){ sCur=room.current; myAnswer=null; sQuestion(); }
  }
  else if(room.phase==="reveal"){ sReveal(); }
  else if(room.phase==="podium"){ sPodium(); }
}
function sLobby(){
  applyTheme();
  const adv=document.body.dataset.gtheme==="adventure";
  app.innerHTML=`<div class="card">${adv?`<h2>🧭 Sẵn sàng lên đường, <b>${esc(myPlayer.name)}</b>!</h2>
    <p class="sub">Em đã gia nhập biệt đội. Chờ thầy bắt đầu chuyến phiêu lưu nhé...</p>`
    :`<h2>Chào <b>${esc(myPlayer.name)}</b>! 🎉</h2>
    <p class="sub">Em đã vào phòng. Chờ thầy bắt đầu nhé...</p>`}<span class="spin"></span>
    ${(room&&room.question_set&&(room.mode||"live")!=="exam")?stageMapHtml(-1,room.question_set.length):""}
    <p class="note">Thầy đã bắt đầu mà em chưa thấy câu hỏi?</p>
    <button class="btn small" onclick="sSyncRoom(true)">🔄 Đồng bộ</button>
    <button class="btn small" onclick="location.reload()">♻️ Tải lại trang</button>
    <p class="note" style="opacity:.6">Phiên bản: ${BUILD_ID}</p></div>`;
}
let sOrd=[], sOrder=[]; // thứ tự hiển thị + thứ tự HS đã xếp (dạng reorder)
let sBossCur=-1, sBossAnswered=false, sBossActive=false, sBossQCur=null, sBossOrigQi=-1; // trạng thái boss của HS
let sReoExam=false, sExamQ=null; // khi HS đang làm bài kiểm tra, sRenderReorder dùng câu kiểm tra thay vì qNow()
/* ===== VÒNG QUAY MAY MẮN ===== */
const SPIN_SEGS=[25,10,20,1,15,10,20,15]; // 8 ô — quay trúng cộng điểm
const SPIN_EVERY=3; // cứ 3 câu đúng được 1 lượt quay
let spinBusy=false, sSpinCorrect=0;
function spinMilestoneKey(){ return "spinM_"+(room?room.id:""); }
function spinLastMilestone(){ try{ return parseInt(localStorage.getItem(spinMilestoneKey())||"0")||0; }catch(e){ return 0; } }
function spinSetMilestone(m){ try{ localStorage.setItem(spinMilestoneKey(),String(m)); }catch(e){} }
function drawWheel(cv,ang){
  const ctx=cv.getContext("2d"), W=cv.width, C=W/2, R=C-10, n=SPIN_SEGS.length;
  ctx.clearRect(0,0,W,W);
  ctx.save(); ctx.translate(C,C); ctx.rotate(ang);
  const cols=["#ffd94d","#b678f0"];
  for(let i=0;i<n;i++){
    const a0=i/n*Math.PI*2, a1=(i+1)/n*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R,a0,a1); ctx.closePath();
    ctx.fillStyle=cols[i%2]; ctx.fill();
    ctx.lineWidth=4; ctx.strokeStyle="#fff"; ctx.stroke();
    ctx.save(); ctx.rotate((a0+a1)/2); ctx.textAlign="right"; ctx.textBaseline="middle";
    ctx.fillStyle=i%2?"#fff":"#5e3a1a"; ctx.font="900 "+Math.round(W/13)+"px sans-serif";
    ctx.fillText("+"+SPIN_SEGS[i], R-16, 0); ctx.restore();
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(C,C,W*0.10,0,7); ctx.fillStyle="#8b5a2b"; ctx.fill();
  ctx.beginPath(); ctx.arc(C,C,W*0.065,0,7); ctx.fillStyle="#ffd94d"; ctx.fill();
  ctx.fillStyle="#d63c3c"; // kim chỉ ở đỉnh
  ctx.beginPath(); ctx.moveTo(C-13,6); ctx.lineTo(C+13,6); ctx.lineTo(C,30); ctx.closePath(); ctx.fill();
}
function sDoSpin(){
  if(spinBusy) return;
  const cv=document.getElementById("wheelCv"); if(!cv) return;
  spinBusy=true;
  const btn=document.getElementById("spinBtn"); if(btn){ btn.disabled=true; }
  const n=SPIN_SEGS.length;
  const seg=Math.floor(Math.random()*n);
  const jitter=Math.random()*24-12;
  const target=((((270-(seg*360/n+360/n/2+jitter))%360)+360)%360)*Math.PI/180;
  const ang=parseFloat(cv.dataset.ang||"0");
  const norm=(((target-ang)%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  const final=ang+Math.PI*2*6+norm;
  const t0=performance.now(), DUR=4500;
  let lastTick=0;
  (function frame(t){
    const p=Math.min(1,(t-t0)/DUR), e=1-Math.pow(1-p,5);
    drawWheel(cv,ang+(final-ang)*e);
    if(t-lastTick>240){ lastTick=t; SFX.tick(); }
    if(p<1) requestAnimationFrame(frame);
    else{ cv.dataset.ang=String(final%(Math.PI*2)); sSpinDone(SPIN_SEGS[seg]); }
  })(t0);
}
async function sSpinDone(prize){
  spinBusy=false;
  const panel=document.getElementById("spinPanel"); if(!panel) return;
  let newScore=null;
  try{
    const {data}=await sb.from("players").select("score").eq("id",myPlayer.id).single();
    newScore=(data?data.score:0)+prize;
    await sb.from("players").update({score:newScore}).eq("id",myPlayer.id);
  }catch(e){}
  spinSetMilestone(Math.floor(sSpinCorrect/SPIN_EVERY));
  SFX.fanfare(); boom(innerWidth/2,innerHeight/3,60);

function sRenderReorder(){

  box.querySelectorAll(".sreorow").forEach(row=>{
    row.addEventListener("dragstart",e=>{ reoDragOi=sOrder[+row.dataset.r]; row.classList.add("drag"); e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain","x");}catch(_){} });
    row.addEventListener("dragend",()=>{ row.classList.remove("drag"); reoDragOi=null; });
    row.addEventListener("dragover",e=>{ e.preventDefault(); row.classList.add("over"); });
    row.addEventListener("dragleave",()=>row.classList.remove("over"));
    row.addEventListener("drop",e=>{ e.preventDefault(); row.classList.remove("over"); sReoDrop(+row.dataset.r); });
    row.addEventListener("touchstart",e=>sReoTS(e,row),{passive:true});
    row.addEventListener("touchmove",e=>sReoTM(e,row),{passive:false});
    row.addEventListener("touchend",()=>sReoTE());

  });
}
function sReoExamTouch(){ // HS vua xep o bai Kiem tra: luu ngay de bo dem "Da lam" nhay len, khoi doi chuyen cau

function sReoMove(r,dir){
  if(myAnswer!==null) return;
  const n=r+dir; if(n<0||n>=sOrder.length) return;
  [sOrder[r],sOrder[n]]=[sOrder[n],sOrder[r]];
  sReoExamTouch(); SFX.click(); sRenderReorder();
}
function sReoDrop(targetR){
  if(myAnswer!==null||reoDragOi===null||reoDragOi===undefined) return;
  const from=sOrder.indexOf(reoDragOi);
  sOrder.splice(from,1);
  let t=targetR; if(from<targetR) t=targetR-1;
  sOrder.splice(Math.max(0,Math.min(sOrder.length,t)),0,reoDragOi);
  reoDragOi=null; sReoExamTouch(); SFX.click(); sRenderReorder();
}
function sReoTS(e,row){
  if(myAnswer!==null||e.target.closest("button")) return;
  reoDrag={r:+row.dataset.r, y0:e.touches[0].clientY, row, ni:null};
  row.classList.add("drag");
}
function sReoTM(e,row){
  if(!reoDrag) return;
  e.preventDefault();
  const dy=e.touches[0].clientY-reoDrag.y0;
  reoDrag.row.style.transform=`translateY(${dy}px)`;
  reoDrag.row.style.zIndex="5";
  const box=document.getElementById("sopts");
  const rows=[...box.querySelectorAll(".sreorow")];
  const h=reoDrag.row.offsetHeight||60;
  let ni=Math.round(reoDrag.r+dy/h);
  ni=Math.max(0,Math.min(rows.length-1,ni));
  rows.forEach(x=>x.classList.remove("over"));
  if(rows[ni]&&rows[ni]!==reoDrag.row) rows[ni].classList.add("over");
  reoDrag.ni=ni;
}
function sReoTE(){
  if(!reoDrag) return;
  const {r,ni}=reoDrag;
  reoDrag=null;
  if(ni!==null&&ni!==undefined&&ni!==r){
    const [oi]=sOrder.splice(r,1);
    sOrder.splice(ni,0,oi);
    sReoExamTouch(); SFX.click();

  sRenderReorder();
}

let sAutoIdx=0, sAutoStreak=0, sAutoCorrect=0, sAutoBusy=false, sAutoAdv=false, sAutoStarted=false, sAutoQStart=0;

function autoPoints(q,cc,ok,ms,streak){
  const bonus=Math.max(0,Math.round(50*(1-ms/(QUESTION_TIME*1000))));
  const combo=comboBonus(streak);
  if(q.type==="reorder"){
    const frac=Math.max(0,Math.min(1,(cc||0)/q.options.length));
    return frac>0?Math.round(100*frac)+((cc===q.options.length)?bonus+combo:0):0;
  }
  return ok?100+bonus+combo:0;
}

  // nếu bắt đầu bị lỗi thì nhả cờ sAutoStarted để lần đồng bộ sau (mỗi 5s) thử lại, không kẹt vĩnh viễn
  try{
    if(!room.question_set||!room.question_set.length){
      const {data}=await sb.from("rooms").select("*").eq("id",room.id).single();
      if(data&&data.question_set&&data.question_set.length) room=data;
    }
    if(!room.question_set||!room.question_set.length){ sAutoStarted=false; return; }
    sAutoBegin();
  }catch(e){ sAutoStarted=false; }
}
function sAutoBegin(){ sAutoIdx=0; sAutoStreak=0; sAutoCorrect=0; myAnswer=null; if(isAdv()) sAutoStageScreen(); else sAutoQ(); }
function sAutoQ(){

    const e=document.getElementById("tmr"); if(e){ e.textContent=r; e.classList.toggle("warn",r<=5); }

async function sAutoAnswer(d){
  if(sAutoBusy) return; sAutoBusy=true;
  const q=room.question_set[sAutoIdx], order=optOrder(q,sAutoIdx), i=order[d], ok=(i===q.correct);
  document.querySelectorAll("#sopts .opt").forEach((el,j)=>{ el.classList.toggle("picked",j===d); el.style.pointerEvents="none"; });
  SFX.click();
  await sAutoRecord(q,0,ok,i);
}
async function sAutoSubmitOrder(auto){
  if(sAutoBusy) return; sAutoBusy=true;
  const q=room.question_set[sAutoIdx];
  let cc=0; sOrder.forEach((oi,pos)=>{ if(oi===pos) cc++; });
  await sAutoRecord(q,cc,cc===q.options.length,cc);
}
async function sAutoSubmitBlank(auto){
  if(sAutoBusy) return;
  const q=room.question_set[sAutoIdx];
  const el=document.getElementById("blankIn"), val=el?el.value:"";
  if(!auto&&!val.trim()){ alert("Em điền đáp án đã nhé!"); return; }
  sAutoBusy=true;
  await sAutoRecord(q,0,blankCorrect(q,val),-1);
}
function sAutoTimeUp(){
  const q=room.question_set[sAutoIdx]; if(!q||sAutoBusy) return;
  if(q.type==="reorder") sAutoSubmitOrder(true);
  else if(q.type==="fillblank") sAutoSubmitBlank(true);
  else { sAutoBusy=true; sAutoRecord(q,0,false,-2); }
}
function withTO(p,ms){ // chống treo khi mạng chập chờn: quá 8 giây là bỏ qua, cho HS chơi tiếp
  return Promise.race([p,new Promise((_,rj)=>setTimeout(()=>rj(new Error("timeout")),ms))]);
}
async function sAutoRecord(q,cc,ok,oi){
  if(timerInt){ clearInterval(timerInt); timerInt=null; }
  const ms=Math.max(0,Date.now()-sAutoQStart);
  if(ok){ sAutoStreak++; sAutoCorrect++; } else sAutoStreak=0;
  const pts=autoPoints(q,cc,ok,ms,sAutoStreak);
  myAnswer={t:"auto",ok};
  try{
    await withTO(sb.from("answers").insert({room_id:room.id,player_id:myPlayer.id,q_index:sAutoIdx,option_index:oi,is_correct:ok,ms}),8000);
    if(pts>0){
      const {data}=await withTO(sb.from("players").select("score").eq("id",myPlayer.id).single(),8000);
      await withTO(sb.from("players").update({score:(data?data.score:0)+pts}).eq("id",myPlayer.id),8000);
    }
  }catch(e){}
  sAutoFeedback(q,ok,pts);
}

function sAutoNext(){
  if(sAutoAdv||room.phase!=="question") return; sAutoAdv=true;
  const N=room.question_set.length, prev=sAutoIdx;
  sAutoIdx++;
  if(sAutoIdx>=N) sAutoDone();
  else if(isAdv()&&stageOfIdx(sAutoIdx,N)>stageOfIdx(prev,N)) sAutoStageScreen();
  else sAutoQ();
}

  applyTheme();
  const N=room.question_set.length;
  let all=[], correct=0;
  try{ const {data}=await sb.from("players").select("*").eq("room_id",room.id).order("score",{ascending:false}); all=data||[]; }catch(e){}
  try{ const {data}=await sb.from("answers").select("q_index,is_correct").eq("room_id",room.id).eq("player_id",myPlayer.id); correct=(data||[]).filter(a=>a.q_index<N&&a.is_correct).length; }catch(e){} // chỉ đếm câu chính, không đếm câu boss (q_index>=1000)

    <p><span class="coinchip">🪙 Xu Lá Chắn: ${myCoins}</span></p>
    ${bossLine}

  if(rank<=3){ SFX.victory(); fireworks(6); } else SFX.fanfare();
