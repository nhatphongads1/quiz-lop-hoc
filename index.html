/* ================= CHẾ ĐỘ KIỂM TRA — phía học sinh =================
   - Thứ tự câu hỏi đảo riêng từng bạn (seed room.id + player.id), đáp án mỗi câu cũng đảo riêng từng bạn
   - HS được qua lại giữa các câu, sửa đáp án trước khi nộp; đáp án đẩy lên máy chủ ngay khi trả lời
   - Đồng hồ đếm ngược chung cho cả phòng; hết giờ tự nộp; sau khi thầy kết thúc thì xem chữa bài */
let sExamStarted=false, sExamSubmitted=false, sExamIdx=0, sExamAns={}, sExamOrd=[];
function sExamMode(){ return (room&&(room.mode||"live"))==="exam"; }
function examHash(str){ let h=2166136261; for(let k=0;k<str.length;k++){ h^=str.charCodeAt(k); h=Math.imul(h,16777619); } let s=h>>>0; return ()=>{ s|=0; s=(s+0x6D2B79F5)|0; let t=Math.imul(s^(s>>>15),1|s); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function examShuffle(arr,seedStr){ const rnd=examHash(seedStr); const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function examOrder(){ const N=room.question_set.length; const idx=[]; for(let i=0;i<N;i++) idx.push(i); return examShuffle(idx,(room.id||"")+"#"+(myPlayer?myPlayer.id:"")); }
function examOptOrder(q,origIdx){ const n=(q&&q.options)?q.options.length:0; const base=[]; for(let i=0;i<n;i++) base.push(i); return examShuffle(base,(room.id||"")+"#"+(myPlayer?myPlayer.id:"")+"#"+origIdx); }
function examAnsScore(q,a){ // {oi, ok} cho 1 câu kiểm tra: choice = đáp án gốc, reorder = số vị trí đúng, blank = -1
  if(!a) return {oi:-2,ok:false};
  if(a.kind==="choice") return {oi:a.oi,ok:(a.oi===q.correct)};
  if(a.kind==="reorder"){ let cc=0; (a.order||[]).forEach((v,pos)=>{ if(v===pos) cc++; }); return {oi:cc,ok:(cc===q.options.length)}; }
  if(a.kind==="blank") return {oi:-1,ok:blankCorrect(q,a.text||"")};
  return {oi:-2,ok:false};
}
function examKey(){ try{ return "examAns_"+(room?room.id:"")+"_"+(myPlayer?myPlayer.id:""); }catch(e){ return "examAns"; } }
function examSaveLS(){ try{ localStorage.setItem(examKey(),JSON.stringify(sExamAns)); }catch(e){} }
function examLoadLS(){ try{ const v=JSON.parse(localStorage.getItem(examKey())||"null"); if(v&&typeof v==="object") sExamAns=v; }catch(e){} }
async function sExamBeginSafe(){
  // Thiếu bộ đề thì tải lại cả phòng từ máy chủ trước khi bắt đầu (giống sAutoBeginSafe)
  try{
    if(!room.question_set||!room.question_set.length){
      const {data}=await sb.from("rooms").select("*").eq("id",room.id).single();
      if(data&&data.question_set&&data.question_set.length) room=data;
    }
    if(!room.question_set||!room.question_set.length){ sExamStarted=false; return; }
    sExamBegin();
  }catch(e){ sExamStarted=false; }
}
function sExamBegin(){ sExamOrd=examOrder(); sExamIdx=0; sExamSubmitted=false; examLoadLS(); sExamRender(); }
function sExamRender(){
  const qs=room.question_set, N=qs.length;
  if(sExamIdx<0) sExamIdx=0; if(sExamIdx>=N) sExamIdx=N-1;
  const origIdx=sExamOrd[sExamIdx], q=qs[origIdx]; if(!q) return;
  applyTheme();
  const ans=sExamAns[origIdx];
  const order=examOptOrder(q,origIdx);
  const letters=["A","B","C","D"];
  let body="";
  sReoExam=false; sExamQ=null;
  if(q.type==="reorder"){
    sReoExam=true; sExamQ=q;
    const cur=ans&&ans.order?[...ans.order]:[...order];
    sOrd=[...order]; sOrder=[...cur];
    body=`<div class="note">🔢 <b>Kéo thả</b> hoặc dùng nút <b>▲ ▼</b> để xếp theo <b>đúng thứ tự</b></div>
      <div class="opts" id="sopts"></div>
      <button class="btn small" onclick="sResetOrder()">↩️ Xếp lại từ đầu</button>`;
  } else if(q.type==="fillblank"){
    const v=ans&&ans.text?ans.text:"";
    body=`<div class="note">✏️ Điền từ còn thiếu</div>
      <input type="text" id="blankIn" placeholder="Em điền đáp án..." autocomplete="off" style="font-size:1.3rem;text-align:center" value="${esc(v)}" oninput="sExamBlankInput(this.value)">`;
  } else {
    body=`<div class="opts" id="sopts">${order.map((oi,d)=>`<div class="opt${ans&&ans.oi===oi?" picked":""}" onclick="sExamPick(${d})">${letters[d]||"•"}. ${esc(q.options[oi])}</div>`).join("")}</div>`;
  }
  const nav=Array.from({length:N},(_,i)=>{ const oi=sExamOrd[i]; const a=sExamAns[oi];
    return `<button class="btn small${i===sExamIdx?" green":""}" style="${a?"":"opacity:.55"}" onclick="sExamJump(${i})">${i+1}</button>`; }).join("");
  app.innerHTML=`<div class="card">
    <div class="note" id="examDone">📝 Bài kiểm tra • Câu ${sExamIdx+1}/${N} • Đã làm ${Object.keys(sExamAns).length}/${N} câu</div>
    <div class="timer" id="examTmr">${examRemainStr()}</div>
    <div class="qtext">${esc(q.q)}</div>${qImg(q)}
    ${body}
    <div style="margin-top:10px">
      <button class="btn" onclick="sExamNav(-1)" ${sExamIdx===0?"disabled":""}>← Câu trước</button>
      <button class="btn" onclick="sExamNav(1)" ${sExamIdx===N-1?"disabled":""}>Câu sau →</button>
    </div>
    <div style="margin-top:10px">${nav}</div>
    <button class="btn big green" style="margin-top:12px" onclick="sExamSubmit(false)">📝 Nộp bài</button>
  </div>`;
  if(q.type==="reorder") sRenderReorder();
  if(examTmrInt) clearInterval(examTmrInt);
  examTmrInt=setInterval(()=>{ const e=document.getElementById("examTmr"); if(e) e.textContent=examRemainStr();
    if(examDeadlineMs()&&Date.now()>=examDeadlineMs()){ clearInterval(examTmrInt); examTmrInt=null; sExamSubmit(true); } },1000);
}
function sExamSaveCurrent(){
  const qs=room.question_set; if(!qs||!qs.length) return;
  const origIdx=sExamOrd[sExamIdx], q=qs[origIdx]; if(!q) return;
  if(q.type==="reorder"){ sExamAns[origIdx]={kind:"reorder",order:[...sOrder]}; examSaveLS(); sExamUpsert(origIdx); }
  else if(q.type==="fillblank"){ const el=document.getElementById("blankIn"); const v=el?el.value:"";
    if(v.trim()){ sExamAns[origIdx]={kind:"blank",text:v}; examSaveLS(); sExamUpsert(origIdx); }
    else if(sExamAns[origIdx]){ delete sExamAns[origIdx]; examSaveLS(); } }
  sExamDoneLine();
}
function sExamDoneLine(){ const el=document.getElementById("examDone"); if(!el||!room||!room.question_set) return;
  el.textContent="📝 Bài kiểm tra • Câu "+(sExamIdx+1)+"/"+room.question_set.length+" • Đã làm "+Object.keys(sExamAns).length+"/"+room.question_set.length+" câu"; }
function sExamPick(d){
  if(sExamSubmitted) return;
  const qs=room.question_set, origIdx=sExamOrd[sExamIdx], q=qs[origIdx]; if(!q) return;
  const order=examOptOrder(q,origIdx), oi=order[d];
  sExamAns[origIdx]={kind:"choice",oi}; examSaveLS(); sExamDoneLine();
  document.querySelectorAll("#sopts .opt").forEach((el,j)=>el.classList.toggle("picked",j===d));
  SFX.click(); sExamUpsert(origIdx);
}
let sExamBlankTO=null;
function sExamBlankInput(v){
  const qs=room.question_set, origIdx=sExamOrd[sExamIdx], q=qs[origIdx]; if(!q) return;
  if(v.trim()) sExamAns[origIdx]={kind:"blank",text:v}; else delete sExamAns[origIdx];
  examSaveLS(); sExamDoneLine();
  if(sExamBlankTO) clearTimeout(sExamBlankTO);
  sExamBlankTO=setTimeout(()=>sExamUpsert(origIdx),800);
}
function sExamNav(dir){ if(sExamSubmitted) return; sExamSaveCurrent(); sExamIdx=Math.max(0,Math.min(room.question_set.length-1,sExamIdx+dir)); sExamRender(); }
function sExamJump(i){ if(sExamSubmitted) return; sExamSaveCurrent(); sExamIdx=i; sExamRender(); }
async function sExamUpsert(origIdx){
  const q=room.question_set[origIdx]; if(!q) return;
  const a=sExamAns[origIdx]; if(!a) return;
  const {oi,ok}=examAnsScore(q,a);
  try{ await withTO(sb.from("answers").upsert({room_id:room.id,player_id:myPlayer.id,q_index:origIdx,option_index:oi,is_correct:ok,ms:0},{onConflict:"room_id,player_id,q_index"}),8000); }catch(e){}
}
function sExamSubmit(auto){ if(sExamSubmitted) return; if(auto){ sExamSubmitGo(); return; } askConfirm("Em chắc chắn muốn nộp bài? Sau khi nộp sẽ không sửa được nữa.",()=>sExamSubmitGo()); }
async function sExamSubmitGo(){
  if(sExamSubmitted) return;
  sExamSubmitted=true;
  if(examTmrInt){ clearInterval(examTmrInt); examTmrInt=null; }
  sExamSaveCurrent();
  const qs=room.question_set, N=qs.length;
  let correct=0;
  for(let origIdx=0;origIdx<N;origIdx++){
    const a=sExamAns[origIdx], q=qs[origIdx];
    const {oi,ok}=examAnsScore(q,a);
    if(ok) correct++;
    try{ await withTO(sb.from("answers").upsert({room_id:room.id,player_id:myPlayer.id,q_index:origIdx,option_index:oi,is_correct:ok,ms:0},{onConflict:"room_id,player_id,q_index"}),8000); }catch(e){}
  }
  const pts=Math.round(correct*1000/N); // thang 10, lưu x100 để giữ số nguyên
  try{ await withTO(sb.from("players").update({score:pts,exam_done:true}).eq("id",myPlayer.id),8000); }catch(e){
    try{ await withTO(sb.from("players").update({score:pts}).eq("id",myPlayer.id),8000); }catch(e2){}
  }
  try{ localStorage.removeItem(examKey()); }catch(e){}
  sExamDone(correct);
}
function sExamDone(correct){
  const N=room.question_set.length;
  const score10=(correct*10/N).toFixed(1);
  app.innerHTML=`<div class="card"><div style="font-size:4rem">🎉</div>
    <h2>Em đã nộp bài!</h2>
    <p class="sub">Điểm của em: <b>${score10}/10</b> • Đúng <b>${correct}/${N}</b> câu</p>
    <p class="note">Chờ thầy kết thúc để xem xếp hạng và chữa bài nhé...</p><span class="spin"></span></div>`;
  SFX.fanfare();
}
async function sExamPodium(){
  if(examTmrInt){ clearInterval(examTmrInt); examTmrInt=null; }
  applyTheme();
  const N=room.question_set.length;
  let all=[], mine=[], allAns=[];
  try{ const {data}=await sb.from("players").select("*").eq("room_id",room.id); all=data||[]; }catch(e){}
  try{ const {data}=await sb.from("answers").select("*").eq("room_id",room.id).eq("player_id",myPlayer.id); mine=data||[]; }catch(e){}
  try{ const {data}=await sb.from("answers").select("player_id,is_correct").eq("room_id",room.id); allAns=data||[]; }catch(e){}
  const byQ={}; mine.forEach(a=>{ byQ[a.q_index]=a; });
  const ccBy={}; allAns.forEach(a=>{ if(a.is_correct) ccBy[a.player_id]=(ccBy[a.player_id]||0)+1; });
  const order=all.map(p=>p.id).sort((x,y)=>(ccBy[y]||0)-(ccBy[x]||0));
  const rank=order.indexOf(myPlayer.id)+1;
  const correct=mine.filter(a=>a.is_correct).length;
  const score10=(correct*10/N).toFixed(1);
  const medal=rank===1?"🥇":rank===2?"🥈":rank===3?"🥉":"🎖️";
  const review=room.question_set.map((q,qi)=>{
    const a=byQ[qi], ok=a?a.is_correct:false;
    let mineTxt="—", rightTxt="";
    if(q.type==="reorder"){ const cc=a?a.option_index||0:0; mineTxt=cc+"/"+q.options.length+" vị trí đúng"; rightTxt=q.options.join(" → "); }
    else if(q.type==="fillblank"){ mineTxt=a?"Đã điền":"Chưa điền"; rightTxt="Đáp án: "+esc(q.options[0]); }
    else { mineTxt=(a&&a.option_index>=0)?esc(q.options[a.option_index]):"—"; rightTxt=esc(q.options[q.correct]); }
    return `<tr><td>${qi+1}</td><td style="text-align:left">${esc(q.q)}<br><span class="note">Em chọn: ${mineTxt} ${ok?"✅":"❌"}<br>Đáp án đúng: <b>${rightTxt}</b></span>${q.explain?`<br><span class="note">💡 ${esc(q.explain)}</span>`:""}</td><td>${ok?"✅":"❌"}</td></tr>`;
  }).join("");
  app.innerHTML=`<div class="card"><div style="font-size:4rem">${medal}</div>
    <h2>${esc(myPlayer.name)} — hạng ${rank}/${all.length}</h2>
    <p class="sub">Điểm: <b>${score10}/10</b> • Đúng <b>${correct}/${N}</b> câu</p>
    <h3>📝 Chữa bài</h3>
    <table class="score"><tr><th>#</th><th style="text-align:left">Câu hỏi</th><th>KQ</th></tr>${review||'<tr><td colspan="3" class="note">Chưa có câu trả lời.</td></tr>'}</table>
  </div>`;
  if(rank<=3){ SFX.victory(); fireworks(6); } else SFX.fanfare();
}

}else{
  showHome();
}
</script>
