<script>
/* ================= ÂM THANH ================= */
let AC=null, musicOn=false, musicTimer=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==="suspended")AC.resume(); return AC; }
function tone(f,d=0.15,type="sine",v=0.22,delay=0){
  const c=ac(); if(!c)return;
  const o=c.createOscillator(), g=c.createGain(), t=c.currentTime+delay;
  o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.05);
}
const SFX={
  click(){ tone(600,0.08,"square",0.12); },
  join(){ tone(523,0.12); tone(659,0.12,"sine",0.22,0.1); tone(784,0.2,"sine",0.22,0.2); },
  correct(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.18,"sine",0.25,i*0.09)); },
  wrong(){ tone(330,0.25,"sawtooth",0.12); tone(220,0.35,"sawtooth",0.12,0.15); },
  tick(){ tone(880,0.06,"square",0.08); },
  urgent(){ [659.25, 783.99, 880, 1046.5].forEach((f,i)=>tone(f,0.12,"triangle",0.28,i*0.11)); tone(196,0.18,"sine",0.2,0); },
  fanfare(){ [523,523,659,784,784,1047,784,1047].forEach((f,i)=>tone(f,0.22,"triangle",0.25,i*0.16)); },
  victory(){
    // Đoạn nhạc vinh danh (~4.5 giây): giai điệu chiến thắng + bass hùng tráng, âm lượng 90%
    const mel=[
      [392,0,.16],[523,.16,.16],[659,.32,.16],[784,.48,.5],
      [784,1.08,.14],[880,1.22,.14],[1047,1.36,.7],
      [1047,2.18,.16],[988,2.34,.16],[1047,2.5,1.1]
    ];
    mel.forEach(([f,t,d])=>tone(f,d,"triangle",0.9,t));
    [0,1.08,2.18].forEach(t=>{ tone(130.8,0.5,"sine",0.55,t); tone(196,0.35,"sine",0.35,t); });
    [523,659,784,1047,1319].forEach(f=>tone(f,1.0,"triangle",0.18,3.7));
  },
  count(){ tone(1000,0.07,"square",0.1); }
};
const MELODY=[523,587,659,784,880,784,659,587,523,587,659,659,587,523,440,523];
function toggleMusic(){
  musicOn=!musicOn;
  document.getElementById("musicBtn").textContent=musicOn?"🎵 Nhạc":"🔇 Nhạc";
  if(musicOn){ let i=0; SFX.click();
    musicTimer=setInterval(()=>{ tone(MELODY[i%MELODY.length],0.28,"triangle",0.1); i++; },300);
  } else clearInterval(musicTimer);
}

/* ============ NHẠC CHỜ Ở SẢNH (chỉ phát trên máy thầy) ============ */
const LobbyMusic={
  timer:null, step:0, nextT:0, on:true, BPM:112,
  chords:[[60,64,67],[55,59,62],[57,60,64],[53,57,60]], // C – G – Am – F
  bass:[48,43,45,41], // C3 G2 A2 F2
  mel:[ // giai điệu vui tươi: 8 nốt móc đơn / ô nhịp (0 = nghỉ)
    [64,0,67,0,69,0,67,0],
    [62,0,65,0,67,0,65,0],
    [69,0,72,0,69,0,67,0],
    [65,0,64,0,62,0,64,0]],
  mf(n){ return 440*Math.pow(2,(n-69)/12); },
  mtone(f,when,d,type,v){
    const c=AC; if(!c) return;
    try{
      const o=c.createOscillator(), g=c.createGain();
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,when);
      g.gain.exponentialRampToValueAtTime(v,when+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,when+d);
      o.connect(g); g.connect(c.destination); o.start(when); o.stop(when+d+0.05);
    }catch(e){}
  },
  start(){
    const c=ac(); if(!c||!this.on) return;
    this.stop();
    this.step=0; this.nextT=c.currentTime+0.15;
    this.timer=setInterval(()=>this.sched(),90);
  },
  stop(){ if(this.timer){ clearInterval(this.timer); this.timer=null; } },
  sched(){
    const c=AC; if(!c||!this.timer) return;
    if(c.state!=="running"){ try{ c.resume(); }catch(e){} return; }
    const e8=60/this.BPM/2;
    let guard=0;
    while(this.nextT < c.currentTime+0.4 && guard++<16){
      this.playStep(this.step,this.nextT);
      this.nextT+=e8; this.step=(this.step+1)%32;
    }
  },
  playStep(s,t){
    const bar=(s/8)|0, st=s%8;
    if(st===0||st===4) this.mtone(this.mf(this.bass[bar]),t,0.32,"sine",0.15);
    if(st%2===0) this.chords[bar].forEach(f=>this.mtone(this.mf(f),t,0.2,"triangle",0.045));
    const m=this.mel[bar][st];
    if(m) this.mtone(this.mf(m),t,0.26,"triangle",0.11);
  }
};

const fxC=document.getElementById("fx"), fxX=fxC.getContext("2d");
let parts=[], fxRun=false;
function fxSize(){ fxC.width=innerWidth; fxC.height=innerHeight; }
addEventListener("resize",fxSize); fxSize();
function boom(x,y,n=60){
  const cols=["#ffd94d","#ff6b6b","#4f7cff","#37d67a","#ff9ff3","#fff"];
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=2+Math.random()*6;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:60+Math.random()*40,c:cols[i%cols.length]}); }
  if(!fxRun){ fxRun=true; requestAnimationFrame(fxTick); }
}
function fireworks(n=5){ for(let i=0;i<n;i++) setTimeout(()=>boom(Math.random()*fxC.width,Math.random()*fxC.height*0.6),i*350); }
function fxTick(){
  fxX.clearRect(0,0,fxC.width,fxC.height);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life--;
    fxX.globalAlpha=Math.min(1,p.life/40); fxX.fillStyle=p.c;
    fxX.beginPath(); fxX.arc(p.x,p.y,3,0,7); fxX.fill(); });
  fxX.globalAlpha=1;
  if(parts.length) requestAnimationFrame(fxTick); else { fxRun=false; fxX.clearRect(0,0,fxC.width,fxC.height); }
}

/* ĐẢO ĐÁP ÁN: thứ tự đáp án hiển thị được xáo trộn NGẪU NHIÊN theo từng ván chơi (mỗi ván có room.id
   khác nhau) và từng câu hỏi, nhưng GIỐNG NHAU trên máy thầy và máy học sinh — không cần đổi database. */
function optOrder(q){
  const n=(q&&q.options)?q.options.length:0;
  const seedStr=((room&&room.id)?room.id:"")+"#"+((room&&typeof room.current!=="undefined")?room.current:0);
  let h=2166136261;
  for(let k=0;k<seedStr.length;k++){ h^=seedStr.charCodeAt(k); h=Math.imul(h,16777619); }
  let s=h>>>0;
  const rnd=()=>{ s|=0; s=(s+0x6D2B79F5)|0; let t=Math.imul(s^(s>>>15),1|s); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; };
  const a=[]; for(let i=0;i<n;i++) a.push(i);
  for(let i=n-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

function stripAcc(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"d"); }
function blankCorrect(q,ans){

  const {data}=await sb.from("question_bank").insert({set_name:nm,questions:[]}).select().single();
  if(data){ bank.push(data); tSetDetail(data.id); }
  else alert("Không lưu được. Kiểm tra mạng nhé thầy!");
}
async function tDelSet(id){
  const s=bank.find(x=>x.id===id);
  if(isDefaultSet(s)){ alert("📌 Bộ đề mặc định không thể xóa."); return; }
  if(!confirm(`Xóa bộ đề "${s?s.set_name:""}"?`)) return;
  if(!String(id).startsWith("fb")) await sb.from("question_bank").delete().eq("id",id);
  bank=bank.filter(x=>x.id!==id); tBankTab();
}
function tSetDetail(id){
  const s=bank.find(x=>x.id===id); if(!s) return;
  const def=isDefaultSet(s);
  const rows=s.questions.map((q,i)=>`<div class="qrow">${typeTag(q)}<b>Câu ${i+1}:</b> ${esc(q.q)}
    ${bankReadOnly||def?"":`<div style="margin-top:8px"><button class="btn small" onclick="tQForm('${id}',${i})">✏️ Sửa</button>
    <button class="btn small red" onclick="tQDel('${id}',${i})">🗑️ Xóa</button></div>`}</div>`).join("");
  document.getElementById("tBody").innerHTML=`
    <h3>📚 ${esc(s.set_name)} (${s.questions.length} câu)${def?` <span class="tag">📌 Mặc định</span>`:""}</h3>
    ${def?`<p class="note">📌 Bộ đề mặc định của hệ thống — không thể sửa, xóa hay thêm câu hỏi.</p>`:""}
    <div style="text-align:left;max-width:640px;margin:0 auto">${rows||'<p class="note">Chưa có câu hỏi nào.</p>'}</div>
    ${bankReadOnly||def?"":`<button class="btn green" onclick="tQForm('${id}',-1)">➕ Thêm câu hỏi</button>
      <button class="btn purple" onclick="tBulkForm('${id}')">📥 Nhập hàng loạt</button>`}
    <button class="btn" onclick="tBankTab()">← Về danh sách</button>`;
}
function tQDel(sid,i){
  const s=bank.find(x=>x.id===sid);
  if(isDefaultSet(s)){ alert("📌 Bộ đề mặc định không thể xóa câu hỏi."); return; }
  if(!confirm("Xóa câu hỏi này?")) return;
  s.questions.splice(i,1); tQSave(sid);
}
async function tQSave(sid){
  const s=bank.find(x=>x.id===sid);
  if(isDefaultSet(s)){ alert("📌 Bộ đề mặc định không thể sửa."); tSetDetail(sid); return; }
  if(!String(sid).startsWith("fb")) await sb.from("question_bank").update({questions:s.questions}).eq("id",sid);
  tSetDetail(sid);
}
function tQOptInputs(t,q){
  const opts=(q&&q.options)||[];
  if(t==="truefalse") return `<label><b>Các đáp án:</b></label><br><p class="note">Dạng Đúng/Sai dùng sẵn 2 đáp án: <b>1. Đúng</b> — <b>2. Sai</b></p>`;
  if(t==="reorder") return `<label><b>Các bước (nhập theo <u>đúng thứ tự</u> từ 1 đến 4):</b></label><br>`+
    [0,1,2,3].map(j=>`<input type="text" id="opt${j}" placeholder="Bước ${j+1} (theo đúng thứ tự)" value="${esc(opts[j]||"")}">`).join("")+
    `<p class="note">💡 Khi chơi, thứ tự các bước sẽ bị đảo lộn — học sinh bấm theo đúng thứ tự để ghi điểm (đúng từng vị trí vẫn được điểm).</p>`;
  if(t==="fillblank") return `<label><b>Đáp án đúng (có thể thêm cách viết khác):</b></label><br>`+
    [0,1,2].map(j=>`<input type="text" id="opt${j}" placeholder="${j===0?"Đáp án đúng (bắt buộc)":"Cách viết khác "+j+" (không bắt buộc)"}" value="${esc(opts[j]||"")}">`).join("")+
    `<p class="note">💡 Hệ thống tự chấp nhận chữ hoa/thường và không dấu (VD: "Hà Nội" = "ha noi").</p>`;
  return `<label><b>Các đáp án:</b></label><br>`+
    [0,1,2,3].map(j=>`<input type="text" id="opt${j}" placeholder="Đáp án ${j+1}" value="${esc(opts[j]||"")}">`).join("");
}
function tQForm(sid,i){
  const s=bank.find(x=>x.id===sid);
  const q=i>=0?s.questions[i]:{type:"choice",q:"",options:["","","",""],correct:0,explain:"",image_url:""};
  editingQ={sid,i};
  const typeOpts=[["choice","Trắc nghiệm 4 đáp án"],["truefalse","Đúng / Sai"],["reorder","🔢 Sắp xếp thứ tự"],["fillblank","✏️ Điền từ"]]
    .map(([v,l])=>`<option value="${v}" ${q.type===v?"selected":""}>${l}</option>`).join("");
  const hideCorrect=(q.type==="reorder"||q.type==="fillblank");
  document.getElementById("tBody").innerHTML=`
    <h3>${i>=0?"✏️ Sửa câu hỏi":"➕ Thêm câu hỏi"} — ${esc(s.set_name)}</h3>
    <div style="text-align:left;max-width:640px;margin:0 auto">
      <label><b>Dạng câu hỏi:</b></label><br>
      <select id="qType" onchange="tQTypeChange()">${typeOpts}</select><br>
      <label><b>Câu hỏi:</b></label>
      <textarea id="qText" placeholder="Nhập câu hỏi...">${esc(q.q)}</textarea><br>
      <div id="optBox">${tQOptInputs(q.type,q)}</div>
      <div id="correctBox" style="${hideCorrect?"display:none":""}">
      <label><b>Đáp án đúng (số thứ tự, bắt đầu từ 1):</b></label><br>
      <input type="text" id="qCorrect" inputmode="numeric" value="${(q.correct??0)+1}" style="max-width:120px"><br>
      </div>
      <label><b>Giải thích (hiện sau khi chốt đáp án):</b></label>
      <textarea id="qExplain" placeholder="Giải thích...">${esc(q.explain||"")}</textarea><br>
      <label><b>Link hình minh họa (không bắt buộc):</b></label><br>
      <input type="text" id="qImg" placeholder="https://..." value="${esc(q.image_url||"")}"><br>
      <span class="note">💡 Muốn có ảnh minh họa đẹp? Gửi ý tưởng vào chat với trợ lý, em vẽ rồi đưa link cho thầy dán vào đây.</span><br><br>
      <button class="btn big green" onclick="tQSubmit()">💾 Lưu câu hỏi</button>
      <button class="btn" onclick="tSetDetail('${sid}')">Hủy</button>
    </div>`;
}
function tQTypeChange(){
  const t=document.getElementById("qType").value;
  document.getElementById("optBox").innerHTML=tQOptInputs(t,{options:[]});
  document.getElementById("correctBox").style.display=(t==="reorder"||t==="fillblank")?"none":"";
}
function tQSubmit(){
  const {sid,i}=editingQ;
  const s=bank.find(x=>x.id===sid);
  const type=document.getElementById("qType").value;
  const qText=document.getElementById("qText").value.trim();
  if(!qText){ alert("Thầy nhập câu hỏi đã nhé!"); return; }
  let options, correct;
  if(type==="truefalse"){ options=["Đúng","Sai"]; correct=parseInt(document.getElementById("qCorrect").value)-1; }
  else if(type==="reorder"){
    options=[0,1,2,3].map(j=>document.getElementById("opt"+j).value.trim());
    if(options.some(o=>!o)){ alert("Thầy nhập đủ 4 bước theo đúng thứ tự nhé!"); return; }
    correct=0;
  }
  else if(type==="fillblank"){
    options=[0,1,2].map(j=>document.getElementById("opt"+j).value.trim()).filter(o=>o);
    if(!options.length){ alert("Thầy nhập ít nhất 1 đáp án đúng nhé!"); return; }
    correct=0;
  }
  else{
    options=[0,1,2,3].map(j=>document.getElementById("opt"+j).value.trim());
    if(options.some(o=>!o)){ alert("Thầy nhập đủ 4 đáp án nhé!"); return; }
    correct=parseInt(document.getElementById("qCorrect").value)-1;
  }
  if(!(correct>=0&&correct<options.length)){ alert("Số thứ tự đáp án đúng chưa hợp lệ!"); return; }
  const q={type,q:qText,options,correct,explain:document.getElementById("qExplain").value.trim(),image_url:document.getElementById("qImg").value.trim()};
  if(i>=0) s.questions[i]=q; else s.questions.push(q);
  SFX.correct(); tQSave(sid);
}
/* ---- Nhập hàng loạt ---- */
function tBulkForm(sid){
  const s=bank.find(x=>x.id===sid); if(!s) return;
  document.getElementById("tBody").innerHTML=`
    <h3>📥 Nhập hàng loạt — ${esc(s.set_name)}</h3>
    <div style="text-align:left;max-width:640px;margin:0 auto">
      <p class="note">Dán danh sách câu hỏi theo định dạng JSON rồi bấm "Nhập".
      <button class="btn small" onclick="tBulkSample()">📋 Xem mẫu</button></p>
      <textarea id="bulkText" style="min-height:220px;font-family:monospace;font-size:.9rem" placeholder='[{"type":"choice","q":"...","options":["A","B","C","D"],"correct":0,"explain":"...","image_url":""}]'></textarea>
      <div id="bulkErr" style="margin:6px 0"></div>
      <button class="btn big green" onclick="tBulkSubmit('${sid}')">📥 Nhập câu hỏi</button>
      <button class="btn" onclick="tSetDetail('${sid}')">Hủy</button>
    </div>`;
}
function tBulkSample(){
  document.getElementById("bulkText").value=JSON.stringify([
    {"type":"choice","q":"Câu hỏi ví dụ?","options":["Đáp án 1","Đáp án 2","Đáp án 3","Đáp án 4"],"correct":1,"explain":"Giải thích...","image_url":""},
    {"type":"truefalse","q":"Câu đúng/sai ví dụ?","options":["Đúng","Sai"],"correct":0,"explain":"Giải thích...","image_url":""},
    {"type":"reorder","q":"Xếp đúng thứ tự các bước rửa tay?","options":["Làm ướt tay","Thoa xà phòng","Chà kỹ kẽ ngón tay","Rửa sạch với nước"],"correct":0,"explain":"...","image_url":""},
    {"type":"fillblank","q":"Thủ đô của Việt Nam là ...","options":["Hà Nội","Ha Noi"],"correct":0,"explain":"...","image_url":""}
  ],null,1);
}
function tBulkSubmit(sid){
  const s=bank.find(x=>x.id===sid); if(!s) return;
  if(isDefaultSet(s)){ alert("📌 Bộ đề mặc định không thể thêm câu hỏi."); return; }
  let arr;
  try{ arr=JSON.parse(document.getElementById("bulkText").value); if(!Array.isArray(arr)) throw 0; }
  catch(e){ document.getElementById("bulkErr").innerHTML=`<div class="cfgwarn">⚠️ Nội dung chưa đúng định dạng JSON. Bấm "Xem mẫu" để tham khảo nhé!</div>`; return; }
  const ok=[];
  const TYPES=["choice","truefalse","reorder","fillblank"];
  for(const x of arr){
    if(!x||!x.q) continue;
    const type=TYPES.includes(x.type)?x.type:"choice";
    let options=null;
    if(type==="truefalse") options=["Đúng","Sai"];
    else if(type==="fillblank"){ const a=Array.isArray(x.options)?x.options.map(String).filter(o=>o.trim()):[]; if(a.length) options=a; }
    else if(Array.isArray(x.options)&&x.options.length===4&&x.options.every(o=>String(o).trim())) options=x.options.map(String);
    if(!options) continue;
    let correct=type==="choice"?(parseInt(x.correct)||0):0; if(correct<0||correct>=options.length) correct=0;
    ok.push({type,q:String(x.q),options,correct,explain:String(x.explain||""),image_url:String(x.image_url||"")});
  }
  if(!ok.length){ document.getElementById("bulkErr").innerHTML=`<div class="cfgwarn">⚠️ Không có câu hỏi hợp lệ nào để nhập.</div>`; return; }
  s.questions=s.questions.concat(ok);
  SFX.fanfare(); fireworks(4); tQSave(sid);
}
</script>

<script>
/* ================= 🤖 AI TẠO CÂU HỎI (Gemini) ================= */
function tAITab(){
  const key=localStorage.getItem("gemini_key")||"";
  document.getElementById("tBody").innerHTML=`
    <div style="text-align:left;max-width:640px;margin:0 auto">
      <div class="aimsg">🤖 <b>Trợ lý AI tạo câu hỏi.</b> Thầy nhập ý tưởng (ví dụ: <i>"an toàn khi dùng mạng xã hội, lớp 4, 5 câu"</i>),
      AI sẽ sinh câu hỏi đủ 4 dạng (trắc nghiệm, đúng/sai, sắp xếp, điền từ) kèm giải thích. Thầy duyệt rồi lưu vào ngân hàng.<br><br>
      🔑 Cần <b>Gemini API key miễn phí</b> — dán vào ô dưới, key chỉ lưu trên máy thầy.</div>
      <details class="aiguide"><summary>📖 Cách lấy Gemini API key miễn phí (làm 1 lần, khoảng 2 phút)</summary>
      <ol>
        <li>Mở trang <b><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a></b> rồi đăng nhập tài khoản Google (tài khoản Gmail thường là được).</li>
        <li>Bấm nút <b>"Create API key"</b> (hoặc "Get API key").</li>
        <li>Nếu được hỏi, chọn tạo key trong dự án có sẵn rồi bấm <b>Create</b>.</li>
        <li>Bấm biểu tượng <b>copy</b> để sao chép dãy key vừa tạo.</li>
        <li>Quay lại đây, <b>dán key vào ô "Gemini API key"</b> rồi dùng như bình thường.</li>
      </ol>
      <p class="note">🔒 Key này như mật khẩu riêng của thầy — đừng chia sẻ cho người khác. Nếu lỡ lộ, vào lại trang trên để xóa key cũ và tạo key mới.</p>
      </details>
      <label><b>Gemini API key:</b></label><br>
      <input type="password" id="gKey" placeholder="Dán key vào đây..." value="${esc(key)}"><br>
      <label><b>Ý tưởng / chủ đề:</b></label>
      <textarea id="gIdea" placeholder="VD: Ôn tập về thông tin trên trang web cho học sinh lớp 4, gồm siêu liên kết, bộ lọc 3 Có, thông tin riêng tư"></textarea><br>
      <label><b>Số câu:</b></label><br>
      <select id="gCount" style="max-width:160px"><option>3</option><option selected>5</option><option>10</option></select><br>
      <button class="btn big purple" id="gBtn" onclick="aiGenerate()">✨ Sinh câu hỏi</button>
      <div id="gOut" style="margin-top:12px"></div>
    </div>`;
}
async function aiGenerate(){
  const key=document.getElementById("gKey").value.trim();
  const idea=document.getElementById("gIdea").value.trim();
  const n=document.getElementById("gCount").value;
  if(!key){ alert("Thầy dán Gemini API key vào trước nhé!"); return; }
  if(!idea){ alert("Thầy nhập ý tưởng/chủ đề đã nhé!"); return; }
  localStorage.setItem("gemini_key",key);
  const out=document.getElementById("gOut"), btn=document.getElementById("gBtn");
  btn.disabled=true; out.innerHTML=`<p><span class="spin"></span> AI đang soạn ${n} câu hỏi...</p>`;
  const prompt=`Bạn là trợ lý soạn câu hỏi trắc nghiệm cho giáo viên tiểu học Việt Nam.
Dựa vào ý tưởng sau, hãy tạo đúng ${n} câu hỏi cho học sinh tiểu học (tiếng Việt đơn giản, mỗi câu có 1 đáp án đúng duy nhất).
Ý tưởng: ${idea}
Mỗi câu thuộc 1 trong 4 dạng (trộn đều các dạng cho sinh động):
- "choice": trắc nghiệm 4 đáp án (đáp án nhiễu phải hợp lý, dễ nhầm).
- "truefalse": câu đúng/sai (options luôn là ["Đúng","Sai"]).
- "reorder": sắp xếp thứ tự — options là 4 mục theo ĐÚNG thứ tự (VD: các bước thực hiện, quy trình), correct luôn là 0.
- "fillblank": điền từ — q chứa chỗ trống "...", options là 1-3 đáp án được chấp nhận (kể cả cách viết không dấu), correct luôn là 0.
Với mỗi câu, đề xuất thêm "image_prompt" (tiếng Anh, ngắn gọn) để vẽ ảnh minh họa KHÔNG có chữ.
Trả về DUY NHẤT một JSON hợp lệ, không thêm lời dẫn hay giải thích:
{"questions":[{"type":"choice","q":"...","options":["...","...","...","..."],"correct":2,"explain":"...","image_prompt":"..."},{"type":"reorder","q":"Xếp đúng thứ tự...?","options":["Bước 1","Bước 2","Bước 3","Bước 4"],"correct":0,"explain":"...","image_prompt":"..."},{"type":"fillblank","q":"... là ...","options":["Đáp án","Dap an"],"correct":0,"explain":"...","image_prompt":"..."}]}`;
  try{
    let j=null, lastErr="";
    const maxTok=Math.min(8000, parseInt(n)*600);
    for(let mi=0; mi<GEMINI_MODELS.length; mi++){ // thử lần lượt, model nào rảnh thì dùng
      const model=GEMINI_MODELS[mi];
      out.innerHTML=`<p><span class="spin"></span> AI đang soạn ${n} câu hỏi...<br><span class="note">(đang kết nối máy chủ ${mi+1}/${GEMINI_MODELS.length})</span></p>`;
      try{
        const ctl=new AbortController();
        const tmr=setTimeout(()=>ctl.abort(), 25000); // mỗi model chờ tối đa 25 giây
        const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`,
          {method:"POST",headers:{"Content-Type":"application/json"},signal:ctl.signal,
           body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.7,maxOutputTokens:maxTok}})});
        clearTimeout(tmr);
        const jj=await r.json();
        if(!r.ok) throw new Error(jj.error&&jj.error.message?jj.error.message:("Lỗi "+r.status));
        j=jj; break;
      }catch(e){ lastErr=(e.name==="AbortError")?"Máy chủ AI phản hồi quá chậm":e.message; }
    }
    if(!j) throw new Error(lastErr||"AI đang bận, thầy thử lại sau ít phút nhé!");
    let txt=j.candidates[0].content.parts.map(p=>p.text||"").join("");
    txt=txt.replace(/```json|```/g,"").trim();
    const data=JSON.parse(txt);
    const TYPES=["choice","truefalse","reorder","fillblank"];
    aiResult=(data.questions||[]).map(x=>{
      const t=TYPES.includes(x.type)?x.type:"choice";
      let options;
      if(t==="truefalse") options=["Đúng","Sai"];
      else if(t==="fillblank") options=Array.isArray(x.options)?x.options.map(String).filter(o=>o.trim()):[];
      else options=Array.isArray(x.options)?x.options.map(String):[];
      return {type:t, q:String(x.q||""), options,
        correct:t==="choice"?Math.max(0,parseInt(x.correct)||0):0, explain:String(x.explain||""), image_url:"",
        image_prompt:String(x.image_prompt||""), keep:true};
    }).filter(x=>x.q&&x.options.length>0&&(x.type==="fillblank"||x.type==="truefalse"||(x.options.length===4&&x.options.every(o=>o.trim()))));
    if(!aiResult.length) throw new Error("AI không trả về câu hỏi nào.");
    SFX.correct(); aiPreview();
  }catch(e){ out.innerHTML=`<div class="cfgwarn">⚠️ ${esc(e.message)}<br><span class="note">Kiểm tra lại API key và mạng rồi thử lại nhé thầy.</span></div>`; }
  btn.disabled=false;
}
function aiPreview(){
  const out=document.getElementById("gOut");
  const rows=aiResult.map((q,i)=>`<label><input type="checkbox" ${q.keep?"checked":""} onchange="aiResult[${i}].keep=this.checked" style="width:20px;height:20px">
    ${typeTag(q)} <b>Câu ${i+1}:</b> ${esc(q.q)}<br>
    <span class="note">${q.options.map((o,j)=>`${j===q.correct?"✅":"▫️"} ${esc(o)}`).join(" &nbsp; ")}</span>
    ${q.image_prompt?`<span class="imgprompt">🎨 Gợi ý ảnh: ${esc(q.image_prompt)} <br>→ Gửi prompt này vào chat với trợ lý để vẽ ảnh minh họa.</span>`:""}
  </label>`).join("");
  const setOpts=bank.filter(s=>!isDefaultSet(s)).map(s=>`<option value="${s.id}">${esc(s.set_name)}</option>`).join("");
  out.innerHTML=`<div class="aiprev"><h3>👀 Thầy duyệt câu hỏi (${aiResult.length} câu):</h3>${rows}
    <label><b>Lưu vào bộ đề:</b></label><br>
    <select id="aiSet">${setOpts}<option value="__new">➕ Tạo bộ đề mới...</option></select>
    <input type="text" id="aiNewName" placeholder="Tên bộ đề mới..." style="display:none"><br>
    <button class="btn big green" onclick="aiSave()">💾 Lưu các câu đã tick</button></div>`;
  document.getElementById("aiSet").onchange=e=>{
    document.getElementById("aiNewName").style.display=e.target.value==="__new"?"block":"none"; };
}
async function aiSave(){
  if(bankReadOnly){ alert("Thầy chạy file supabase-v2-migration.sql trong SQL Editor trước nhé!"); return; }
  const kept=aiResult.filter(q=>q.keep).map(({keep,image_prompt,...rest})=>rest);
  if(!kept.length){ alert("Thầy tick chọn ít nhất 1 câu nhé!"); return; }
  let sid=document.getElementById("aiSet").value;
  if(sid==="__new"){
    const nm=document.getElementById("aiNewName").value.trim()||"Bộ đề AI "+new Date().toLocaleDateString("vi-VN");
    const {data}=await sb.from("question_bank").insert({set_name:nm,questions:[]}).select().single();
    if(!data){ alert("Không lưu được. Kiểm tra mạng nhé thầy!"); return; }
    bank.push(data); sid=data.id;
  }
  const s=bank.find(x=>x.id===sid);
  if(isDefaultSet(s)){ alert("📌 Không thể lưu vào bộ đề mặc định. Thầy chọn bộ đề khác hoặc tạo bộ mới nhé!"); return; }
  s.questions=s.questions.concat(kept);
  if(!String(sid).startsWith("fb")) await sb.from("question_bank").update({questions:s.questions}).eq("id",sid);
  SFX.fanfare(); fireworks(5);
  document.getElementById("gOut").innerHTML=`<div class="aimsg">✅ Đã lưu ${kept.length} câu vào bộ đề <b>${esc(s.set_name)}</b>!</div>`;
}
</script>

<script>
/* ================= GIÁO VIÊN: ĐIỀU KHIỂN PHÒNG ================= */
let lockedOnce=false;
function unsubAll(){ [channel,channel2,channel3].forEach(c=>{try{c&&c.unsubscribe()}catch(e){}}); channel=channel2=channel3=null; if(timerInt){clearInterval(timerInt);timerInt=null;} }
async function tCreateRoom(){
  SFX.click();
  const sid=document.getElementById("setSel").value;
  const s=bank.find(x=>x.id===sid);
  if(!s||!s.questions.length){ alert("Bộ đề này chưa có câu hỏi. Thầy thêm trong tab Ngân hàng nhé!"); return; }
  unsubAll();
  let pin="";
  for(let t=0;t<20;t++){ pin=String(Math.floor(100000+Math.random()*900000));
    const {data}=await sb.from("rooms").select("id").eq("pin",pin).limit(1);
    if(!data||!data.length) break; }
  const theme=canAdventure()?roomTheme:"classic";
  let res=await sb.from("rooms").insert({pin,phase:"lobby",current:0,question_set:s.questions,theme}).select().single();
  if(res.error&&/theme/i.test(res.error.message||"")){
    // chưa chạy migration v4 (thiếu cột theme) → tạo phòng kiểu cổ điển
    res=await sb.from("rooms").insert({pin,phase:"lobby",current:0,question_set:s.questions}).select().single();
  }
  const {data,error}=res;
  if(error){ alert("Lỗi tạo phòng: "+error.message); return; }
  room=data; players=[]; answers=[]; lockedOnce=false; roomAnsAll=[]; streakMap={};
  SFX.join(); tLobby();
}
function showTeacherRejoin(){
  app.innerHTML=`<div class="card"><h2>🔑 Vào lại phòng cũ</h2>
    <input type="text" id="rePin" inputmode="numeric" placeholder="Nhập PIN..." maxlength="6">
    <br><button class="btn big green" onclick="tRejoin()">Vào phòng</button>
    <button class="btn" onclick="showTeacher()">← Quay lại</button></div>`;
}
async function tRejoin(){
  const pin=document.getElementById("rePin").value.trim();
  const {data}=await sb.from("rooms").select("*").eq("pin",pin).order("created_at",{ascending:false}).limit(1);
  if(!data||!data.length){ alert("Không tìm thấy phòng với PIN này!"); return; }
  unsubAll(); room=data[0]; lockedOnce=false; roomAnsAll=[]; streakMap={};
  const {data:pl}=await sb.from("players").select("*").eq("room_id",room.id).order("created_at");
  players=pl||[];
  if(room.phase==="lobby") tLobby();
  else if(room.phase==="question") tQuestion();
  else if(room.phase==="reveal") tShowReveal();
  else tPodium();
}
function tLobby(){
  LobbyMusic.start(); applyTheme();
  const adv=document.body.dataset.gtheme==="adventure";
  const n=room.question_set.length;
  const journey=adv?`<h3>🗺️ Bản đồ nhiệm vụ</h3>
    <div class="journey"><span class="jflag">🏁</span>${Array.from({length:n},(_,i)=>`<span class="jlink"></span><span class="jstop">${i+1}</span>`).join("")}<span class="jlink"></span><span class="jflag">🏆</span></div>
    <div class="jcap">${n} chặng thám hiểm đang chờ biệt đội!</div>`:"";
  const subHtml=adv?"Thám hiểm viên mở link game rồi nhập <b>mật mã</b> này!"
    :`Học sinh mở <b>${esc(location.host+location.pathname)}</b> rồi nhập PIN này`;
  app.innerHTML=`<div class="card">
    <h2>${adv?"🧭 Mật mã lên đường":"🔑 Mã PIN phòng"}</h2><div class="pin">${room.pin}</div>
    <p class="sub">${subHtml}</p>
    ${journey}
    <h3>🎒 Đã vào: <span id="pcount">0</span> bạn</h3>
    <div class="plist" id="plist"></div><br>
    <button class="btn big green" id="startBtn" onclick="tStartQ()" disabled>▶ Bắt đầu (chờ học sinh...)</button><br>
    <button class="btn small" id="lobbyMusicBtn" onclick="toggleLobbyMusic()">🎵 Nhạc chờ: Bật</button>
  </div>`;
  const render=async()=>{
    const {data}=await sb.from("players").select("*").eq("room_id",room.id).order("created_at");
    players=data||[];
    const pl=document.getElementById("plist"); if(pl) pl.innerHTML=players.map(p=>`<span class="pname">${esc(p.name)}</span>`).join("");
    const pc=document.getElementById("pcount"); if(pc) pc.textContent=players.length;
    const b=document.getElementById("startBtn"); if(b){ b.disabled=!players.length; b.innerHTML=players.length?"▶ Bắt đầu!":"▶ Bắt đầu (chờ học sinh...)"; }
  };
  render();
  channel2=sb.channel("tpl-"+room.id)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"players",filter:"room_id=eq."+room.id},()=>{ render(); SFX.join(); })
    .subscribe();
}
async function tStartQ(){
  SFX.click(); unsubAll(); LobbyMusic.stop();
  await sb.from("rooms").update({phase:"question",current:0,question_started_at:new Date().toISOString()}).eq("id",room.id);
  room.phase="question"; room.current=0; room.question_started_at=new Date().toISOString();
  tQuestion();
}
function tQuestion(){
  const q=qNow(); if(!q) return; applyTheme();
  const idx=room.current, total=room.question_set.length;
  const letters=["A","B","C","D"], order=optOrder(q);
  const typeNote=q.type==="truefalse"?"• Dạng Đúng/Sai":q.type==="reorder"?"• 🔢 Xếp đúng thứ tự":q.type==="fillblank"?"• ✏️ Điền từ":"";
  const optsHtml=q.type==="fillblank"
    ? `<p class="sub">✏️ Học sinh điền đáp án vào ô trống trên máy của mình</p>`
    : `<div class="opts">${order.map((oi,d)=>`<div class="opt dim">${letters[d]||"•"}. ${esc(q.options[oi])}</div>`).join("")}</div>`;
  app.innerHTML=`<div class="card">
    <div class="note">Câu ${idx+1}/${total} ${typeNote}</div>
    <div class="timer" id="tmr">${QUESTION_TIME}</div>
    <div class="qtext">${esc(q.q)}</div>${qImg(q)}
    ${optsHtml}
    <p class="sub">✅ Đã trả lời: <b id="acount">0</b> / ${players.length} bạn</p>
    <button class="btn big red" onclick="tLock()">⏹ Chốt đáp án</button>
  </div>`;
  lastTick=99; locking=false;
  if(timerInt) clearInterval(timerInt);
  timerInt=setInterval(()=>{ const r=remain(); const e=document.getElementById("tmr");
    if(e){ e.textContent=r; e.classList.toggle("warn",r<=5); }
    if(r<=5&&r!==lastTick&&r>0){ lastTick=r; SFX.urgent(); }
    if(r<=0&&!locking){ locking=true; tLock(); }
  },250);
  channel2=sb.channel("tans-"+room.id+"-"+idx)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"answers",filter:"room_id=eq."+room.id},async()=>{
      const {count}=await sb.from("answers").select("id",{count:"exact",head:true}).eq("room_id",room.id).eq("q_index",idx);
      const e=document.getElementById("acount"); if(e) e.textContent=count||0;
    }).subscribe();
}
async function tLock(){
  if(lockedOnce) return; lockedOnce=true;
  if(timerInt){ clearInterval(timerInt); timerInt=null; }
  SFX.click();
  const idx=room.current, q=qNow();
  const {data:ans}=await sb.from("answers").select("*").eq("room_id",room.id).eq("q_index",idx);
  answers=ans||[];
  try{ const r=await sb.from("answers").select("player_id,q_index,is_correct").eq("room_id",room.id); roomAnsAll=r.data||[]; }catch(e){}
  const pmap={}; players.forEach(p=>pmap[p.id]=p);
  streakMap={};
  for(const p of players) streakMap[p.id]=streakOf(roomAnsAll.filter(x=>x.player_id===p.id),idx);
  for(const a of answers){
    if(!pmap[a.player_id]) continue;
    const bonus=Math.max(0,Math.round(50*(1-a.ms/(QUESTION_TIME*1000))));
    const combo=comboBonus(streakMap[a.player_id]||0);
    if(q.type==="reorder"){
      const frac=Math.max(0,Math.min(1,(a.option_index||0)/q.options.length));
      if(frac>0) pmap[a.player_id].score+=Math.round(100*frac)+(a.is_correct?bonus+combo:0);
    } else if(a.is_correct){
      pmap[a.player_id].score+=100+bonus+combo;
    }
  }
  for(const p of players) await sb.from("players").update({score:p.score}).eq("id",p.id);
  await sb.from("rooms").update({phase:"reveal"}).eq("id",room.id);
  room.phase="reveal";
  tShowReveal();
}
async function tShowReveal(){
  const q=qNow(); if(!q) return; applyTheme();
  await ensureAnsAll();
  const idx=room.current;
  try{
    const {data}=await sb.from("answers").select("*").eq("room_id",room.id).eq("q_index",idx);
    answers=data||[];
  }catch(e){}
  const total=room.question_set.length;
  const letters=["A","B","C","D"], last=idx>=total-1, order=optOrder(q);
  let resultHtml="";
  if(q.type==="reorder"){
    const full=answers.filter(a=>a.is_correct).length;
    const part=answers.length-full;
    resultHtml=`<div class="qtext" style="font-size:1.3rem">Thứ tự đúng:<br><b>${q.options.map((o,i)=>`${i+1}. ${esc(o)}`).join("<br>")}</b></div>
    <h3>📊 Kết quả</h3>
    <div class="bar right" onclick="tWhoPicked(0,'rofull')" style="cursor:pointer"><div style="width:${answers.length?Math.max(8,Math.round(full/answers.length*100)):8}%">🎯 Đúng hoàn toàn: ${full}/${answers.length}</div></div>
    ${part?`<p class="note" onclick="tWhoPicked(0,'ropart')" style="cursor:pointer;text-decoration:underline">💪 ${part} bạn đúng một phần — bấm để xem tên</p>`:""}
    <p class="note">Điểm tính theo số vị trí đúng (mỗi vị trí = ${Math.round(100/q.options.length)} điểm).</p>
    <div id="whoBox"></div>`;
  } else if(q.type==="fillblank"){
    const full=answers.filter(a=>a.is_correct).length;
    const wrong=answers.length-full;
    resultHtml=`<div class="qtext" style="font-size:1.3rem">Đáp án được chấp nhận: <b>${q.options.map(o=>esc(o)).join(" / ")}</b></div>
    <h3>📊 Kết quả</h3>
    <div class="bar right" onclick="tWhoPicked(0,'blfull')" style="cursor:pointer"><div style="width:${answers.length?Math.max(8,Math.round(full/answers.length*100)):8}%">🎯 Trả lời đúng: ${full}/${answers.length}</div></div>
    ${wrong?`<p class="note" onclick="tWhoPicked(0,'blwrong')" style="cursor:pointer;text-decoration:underline">😅 ${wrong} bạn chưa đúng — bấm để xem tên</p>`:""}
    <div id="whoBox"></div>`;
  } else {
    const counts=q.options.map((_,i)=>answers.filter(a=>a.option_index===i).length);
    const maxC=Math.max(1,...counts);
    resultHtml=`<div class="opts">${order.map((oi,d)=>`<div class="opt ${oi===q.correct?"correct":""}" onclick="tWhoPicked(${oi},'choice')" style="cursor:pointer">${oi===q.correct?"✅":"▫️"} ${letters[d]||"•"}. ${esc(q.options[oi])}</div>`).join("")}</div>
    <h3>📊 Cả lớp đã chọn</h3>
    ${order.map((oi,d)=>`<div class="bar ${oi===q.correct?"right":""}" onclick="tWhoPicked(${oi},'choice')" style="cursor:pointer"><div style="width:${Math.max(8,Math.round(counts[oi]/maxC*100))}%">${letters[d]||"•"}: ${counts[oi]}</div></div>`).join("")}
    <p class="note">👆 Bấm vào đáp án để xem tên các bạn đã chọn.</p>
    <div id="whoBox"></div>`;
  }
  app.innerHTML=`<div class="card">
    <div class="note">Câu ${idx+1}/${total} — Kết quả (${answers.length} bạn đã trả lời)</div>
    <div class="qtext">${esc(q.q)}</div>${qImg(q)}
    ${resultHtml}
    ${journeyHtml()}
    ${q.explain?`<div class="explain">💡 ${esc(q.explain)}</div>`:""}
    <h3>🏅 Bảng điểm</h3><div id="scoreWrap">${scoreTable()}</div>
    <button class="btn big green" onclick="tNext()">${last?"🏁 Xem vinh danh":"Câu tiếp theo ➡"}</button>
  </div>`;
  // Theo dõi vòng quay may mắn của HS: điểm tăng trong lúc chốt = vừa quay trúng
  try{ channel3&&channel3.unsubscribe(); }catch(e){}
  channel3=sb.channel("tspin-"+room.id+"-"+idx)
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"players",filter:"room_id=eq."+room.id},payload=>{
      const p=players.find(x=>x.id===payload.new.id); if(!p) return;
      const delta=payload.new.score-p.score; p.score=payload.new.score;
      if(delta>0){
        const w=document.getElementById("scoreWrap"); if(w) w.innerHTML=scoreTable();
        toast(`🎡 <b>${esc(p.name)}</b> quay may mắn +${delta} điểm!`);
        SFX.fanfare();
      }
    }).subscribe();
}
function scoreTable(){
  const s=[...players].sort((a,b)=>b.score-a.score);
  if(!s.length) return `<p class="note">Chưa có học sinh.</p>`;
  return `<table class="score">${s.map((p,i)=>{ const st=streakMap[p.id]||0;
    return `<tr><td>${i+1}</td><td style="text-align:left"><b>${esc(p.name)}</b>${st>=2?` <span class="streak">🔥x${st}</span>`:""}</td><td><b>${p.score}</b> đ</td></tr>`; }).join("")}</table>`;
}
async function tNext(){
  SFX.click(); lockedOnce=false;
  const total=room.question_set.length;
  if(room.current>=total-1){
    await sb.from("rooms").update({phase:"podium"}).eq("id",room.id);
    room.phase="podium"; tPodium();
  }else{
    const nx=room.current+1;
    unsubAll();
    await sb.from("rooms").update({phase:"question",current:nx,question_started_at:new Date().toISOString()}).eq("id",room.id);
    room.current=nx; room.phase="question"; room.question_started_at=new Date().toISOString();
    tQuestion();
  }
}
function tPodium(){
  unsubAll(); applyTheme();
  const advT=document.body.dataset.gtheme==="adventure";
  const s=[...players].sort((a,b)=>b.score-a.score);
  const step=(p,cls,md)=>p?`<div class="step ${cls}"><span class="medal">${md}</span><span class="nm">${esc(p.name)}</span><span class="sc">${p.score} đ</span></div>`:`<div class="step ${cls}"><span class="medal">—</span></div>`;
  const treasure=advT&&s[0]?`<p class="sub">🎁 <b>${esc(s[0].name)}</b> mở <b>Rương VÀNG</b>!${s[1]?` • <b>${esc(s[1].name)}</b> mở <b>Rương Bạc</b>`:""}${s[2]?` • <b>${esc(s[2].name)}</b> mở <b>Rương Đồng</b>`:""}</p>`:"";
  app.innerHTML=`<div class="card">
    <h1>${advT?"🗺️ Chuyến phiêu lưu hoàn thành!":"🏆 Vinh danh"}</h1>
    ${treasure}
    <div class="podium">${step(s[1],"s2","🥈")}${step(s[0],"s1","🥇")}${step(s[2],"s3","🥉")}</div>
    <h3>📋 Cả lớp</h3>${scoreTable()}
    <button class="btn big" onclick="showTeacher()">🏠 Về trang giáo viên</button>
  </div>`;
  SFX.victory(); fireworks(8);
}
</script>

<script>
/* ================= HỌC SINH ================= */
let sCur=-1;
function showStudentJoin(){
  sbInit(); mode="student"; unsubAll();
  app.innerHTML=`<div class="card"><h2>🎒 Học sinh vào phòng</h2>
    <input type="text" id="jPin" inputmode="numeric" placeholder="Mã PIN..." maxlength="6">
    <input type="text" id="jName" placeholder="Tên của em..." maxlength="24">
    <br><button class="btn big orange" onclick="sJoin()">🚀 Vào phòng</button>
    <p class="note">Hỏi thầy mã PIN đang hiện trên màn hình lớp nhé!</p></div>`;
}
async function sJoin(){
  const pin=document.getElementById("jPin").value.trim();
  const name=document.getElementById("jName").value.trim();
  if(pin.length<4){ alert("Em nhập mã PIN nhé!"); return; }
  if(!name){ alert("Em nhập tên nhé!"); return; }
  SFX.click();
  const {data}=await sb.from("rooms").select("*").eq("pin",pin).order("created_at",{ascending:false}).limit(1);
  if(!data||!data.length){ alert("Không tìm thấy phòng! Kiểm tra lại PIN nhé."); return; }
  room=data[0];
  if(room.phase!=="lobby"){ alert("Phòng này đã bắt đầu rồi. Em chờ ván sau nhé!"); return; }
  const {data:p,error}=await sb.from("players").insert({room_id:room.id,name}).select().single();
  if(error){ alert("Lỗi vào phòng: "+error.message); return; }
  myPlayer=p; sCur=-1; myAnswer=null; SFX.join();
  subRoomStudent(); sLobby();
}
function subRoomStudent(){
  channel=sb.channel("sroom-"+room.id)
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"rooms",filter:"id=eq."+room.id},payload=>{
      room=payload.new; onRoomChange();
    }).subscribe();
  setTimeout(async()=>{ // đề phòng đổi pha trước khi kênh realtime kịp nối
    const {data}=await sb.from("rooms").select("*").eq("id",room.id).single();
    if(data&&(data.phase!==room.phase||data.current!==room.current)){ room=data; onRoomChange(); }
  },2500);
}
function onRoomChange(){
  if(room.phase==="question"){
    if(sCur!==room.current){ sCur=room.current; myAnswer=null; sQuestion(); }
  }
  else if(room.phase==="reveal"){ sReveal(); }
  else if(room.phase==="podium"){ sPodium(); }
}
function sLobby(){
  applyTheme();
  const adv=document.body.dataset.gtheme==="adventure";
  app.innerHTML=`<div class="card">${adv?`<h2>🧭 Sẵn sàng lên đường, <b>${esc(myPlayer.name)}</b>!</h2>
    <p class="sub">Em đã gia nhập biệt đội. Chờ thầy bắt đầu chuyến phiêu lưu nhé...</p>`
    :`<h2>Chào <b>${esc(myPlayer.name)}</b>! 🎉</h2>
    <p class="sub">Em đã vào phòng. Chờ thầy bắt đầu nhé...</p>`}<span class="spin"></span></div>`;
}
let sOrd=[], sOrder=[]; // thứ tự hiển thị + thứ tự HS đã xếp (dạng reorder)
/* ===== VÒNG QUAY MAY MẮN ===== */
const SPIN_SEGS=[25,10,20,1,15,10,20,15]; // 8 ô — quay trúng cộng điểm
const SPIN_EVERY=3; // cứ 3 câu đúng được 1 lượt quay
let spinBusy=false, sSpinCorrect=0;
function spinMilestoneKey(){ return "spinM_"+(room?room.id:""); }
function spinLastMilestone(){ try{ return parseInt(localStorage.getItem(spinMilestoneKey())||"0")||0; }catch(e){ return 0; } }
function spinSetMilestone(m){ try{ localStorage.setItem(spinMilestoneKey(),String(m)); }catch(e){} }
function drawWheel(cv,ang){
  const ctx=cv.getContext("2d"), W=cv.width, C=W/2, R=C-10, n=SPIN_SEGS.length;
  ctx.clearRect(0,0,W,W);
  ctx.save(); ctx.translate(C,C); ctx.rotate(ang);
  const cols=["#ffd94d","#b678f0"];
  for(let i=0;i<n;i++){
    const a0=i/n*Math.PI*2, a1=(i+1)/n*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R,a0,a1); ctx.closePath();
    ctx.fillStyle=cols[i%2]; ctx.fill();
    ctx.lineWidth=4; ctx.strokeStyle="#fff"; ctx.stroke();
    ctx.save(); ctx.rotate((a0+a1)/2); ctx.textAlign="right"; ctx.textBaseline="middle";
    ctx.fillStyle=i%2?"#fff":"#5e3a1a"; ctx.font="900 "+Math.round(W/13)+"px sans-serif";
    ctx.fillText("+"+SPIN_SEGS[i], R-16, 0); ctx.restore();
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(C,C,W*0.10,0,7); ctx.fillStyle="#8b5a2b"; ctx.fill();
  ctx.beginPath(); ctx.arc(C,C,W*0.065,0,7); ctx.fillStyle="#ffd94d"; ctx.fill();
  ctx.fillStyle="#d63c3c"; // kim chỉ ở đỉnh
  ctx.beginPath(); ctx.moveTo(C-13,6); ctx.lineTo(C+13,6); ctx.lineTo(C,30); ctx.closePath(); ctx.fill();
}
function sDoSpin(){
  if(spinBusy) return;
  const cv=document.getElementById("wheelCv"); if(!cv) return;
  spinBusy=true;
  const btn=document.getElementById("spinBtn"); if(btn){ btn.disabled=true; btn.textContent="🌀 Đang quay..."; }
  const n=SPIN_SEGS.length;
  const seg=Math.floor(Math.random()*n);
  const jitter=Math.random()*24-12;
  const target=((((270-(seg*360/n+360/n/2+jitter))%360)+360)%360)*Math.PI/180;
  const ang=parseFloat(cv.dataset.ang||"0");
  const norm=(((target-ang)%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  const final=ang+Math.PI*2*6+norm;
  const t0=performance.now(), DUR=4500;
  let lastTick=0;
  (function frame(t){
    const p=Math.min(1,(t-t0)/DUR), e=1-Math.pow(1-p,5);
    drawWheel(cv,ang+(final-ang)*e);
    if(t-lastTick>240){ lastTick=t; SFX.tick(); }
    if(p<1) requestAnimationFrame(frame);
    else{ cv.dataset.ang=String(final%(Math.PI*2)); sSpinDone(SPIN_SEGS[seg]); }
  })(t0);
}
async function sSpinDone(prize){
  spinBusy=false;
  const panel=document.getElementById("spinPanel"); if(!panel) return;
  let newScore=null;
  try{
    const {data}=await sb.from("players").select("score").eq("id",myPlayer.id).single();
    newScore=(data?data.score:0)+prize;
    await sb.from("players").update({score:newScore}).eq("id",myPlayer.id);
  }catch(e){}
  spinSetMilestone(Math.floor(sSpinCorrect/SPIN_EVERY));
  SFX.fanfare(); boom(innerWidth/2,innerHeight/3,60);
  panel.innerHTML=`<div class="spinwin">🎉 Chúc mừng!<br><span>+${prize} điểm</span></div>
    <p class="sub">${newScore!==null?`Tổng điểm của em: <b>${newScore}</b>`:"Điểm đã được cộng vào bảng xếp hạng!"}</p>`;
}
function toast(html){
  let t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; document.body.appendChild(t); }
  t.innerHTML=html; t.classList.add("show");
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove("show"),2800);
}
function sRenderOrder(){
  const q=qNow(); if(!q) return;
  const letters=["A","B","C","D"];
  const box=document.getElementById("sopts"); if(!box) return;
  box.innerHTML=sOrd.map((oi,d)=>{
    const pos=sOrder.indexOf(oi)+1;
    return `<div class="opt${pos?" picked":""}" onclick="sPickOrder(${d})">${pos?`<span class="ordn">${pos}</span>`:""}${letters[d]||"•"}. ${esc(q.options[oi])}</div>`;
  }).join("");
}
function sPickOrder(d){
  if(myAnswer!==null) return;
  const oi=sOrd[d]; if(oi===undefined||sOrder.includes(oi)) return;
  sOrder.push(oi); SFX.click(); sRenderOrder();
}
function sClearOrder(){ if(myAnswer!==null) return; sOrder=[]; SFX.click(); sRenderOrder(); }
async function sSubmitOrder(auto){
  if(myAnswer!==null) return;
  const q=qNow(); if(!q) return;
  if(!auto&&sOrder.length<q.options.length){ alert(`Em xếp đủ ${q.options.length} đáp án rồi bấm Xong nhé!`); return; }
  let cc=0; sOrder.forEach((oi,pos)=>{ if(oi===pos) cc++; });
  const ok=cc===q.options.length;
  myAnswer={t:"reorder",cc};
  const ms=Math.max(0,Date.now()-new Date(room.question_started_at).getTime());
  try{ await sb.from("answers").insert({room_id:room.id,player_id:myPlayer.id,q_index:room.current,option_index:cc,is_correct:ok,ms}); }catch(e){}
  if(timerInt) clearInterval(timerInt);
  app.innerHTML=`<div class="card"><h2>✅ Đã trả lời!</h2><p class="sub">Chờ thầy chốt đáp án nhé...</p><span class="spin"></span></div>`;
}
async function sSubmitBlank(auto){
  if(myAnswer!==null) return;
  const q=qNow(); if(!q) return;
  const el=document.getElementById("blankIn");
  const val=el?el.value:"";
  if(!auto&&!val.trim()){ alert("Em điền đáp án đã nhé!"); return; }
  const ok=blankCorrect(q,val);
  myAnswer={t:"blank",ok};
  const ms=Math.max(0,Date.now()-new Date(room.question_started_at).getTime());
  try{ await sb.from("answers").insert({room_id:room.id,player_id:myPlayer.id,q_index:room.current,option_index:-1,is_correct:ok,ms}); }catch(e){}
  if(timerInt) clearInterval(timerInt);
  app.innerHTML=`<div class="card"><h2>✅ Đã trả lời!</h2><p class="sub">Chờ thầy chốt đáp án nhé...</p><span class="spin"></span></div>`;
}
function sTimeUp(){
  const q=qNow(); if(!q||myAnswer!==null) return;
  if(q.type==="reorder") sSubmitOrder(true);
  else if(q.type==="fillblank") sSubmitBlank(true);
}
function sQuestion(){
  const q=qNow(); if(!q) return; applyTheme();
  sOrd=[]; sOrder=[];
  const letters=["A","B","C","D"], order=optOrder(q);
  let body="";
  if(q.type==="reorder"){
    sOrd=order;
    body=`<div class="note">🔢 Bấm các đáp án theo <b>đúng thứ tự</b> từ 1 đến ${q.options.length}</div>
      <div class="opts" id="sopts"></div>
      <button class="btn small" onclick="sClearOrder()">↩️ Xếp lại</button>
      <button class="btn big green" onclick="sSubmitOrder(false)">✅ Xong</button>`;
  } else if(q.type==="fillblank"){
    body=`<div class="note">✏️ Điền từ còn thiếu rồi bấm Trả lời</div>
      <input type="text" id="blankIn" placeholder="Em điền đáp án..." autocomplete="off" style="font-size:1.3rem;text-align:center">
      <br><button class="btn big green" onclick="sSubmitBlank(false)">✅ Trả lời</button>`;
  } else {
    body=`<div class="opts" id="sopts">${order.map((oi,d)=>`<div class="opt" onclick="sAnswer(${d})">${letters[d]||"•"}. ${esc(q.options[oi])}</div>`).join("")}</div>`;
  }
  app.innerHTML=`<div class="card">
    <div class="note">Câu ${room.current+1}/${room.question_set.length} ${typeTag(q)}</div>
    <div class="timer" id="tmr">${QUESTION_TIME}</div>
    <div class="qtext">${esc(q.q)}</div>${qImg(q)}
    ${body}
  </div>`;
  if(q.type==="reorder") sRenderOrder();
  if(timerInt) clearInterval(timerInt);
  timerInt=setInterval(()=>{ const r=remain(); const e=document.getElementById("tmr");
    if(e){ e.textContent=r; e.classList.toggle("warn",r<=5); } if(r<=0){ clearInterval(timerInt); sTimeUp(); } },250);
}
async function sAnswer(d){
  if(myAnswer!==null) return;
  const q=qNow(); const order=optOrder(q); const i=order[d];
  myAnswer=i; SFX.click();
  document.querySelectorAll("#sopts .opt").forEach((el,j)=>{ el.classList.toggle("picked",j===d); el.style.pointerEvents="none"; });
  const ms=Math.max(0,Date.now()-new Date(room.question_started_at).getTime());
  try{ await sb.from("answers").insert({room_id:room.id,player_id:myPlayer.id,q_index:room.current,option_index:i,is_correct:i===q.correct,ms}); }catch(e){}
  if(timerInt) clearInterval(timerInt);
  app.innerHTML=`<div class="card"><h2>✅ Đã trả lời!</h2><p class="sub">Chờ thầy chốt đáp án nhé...</p><span class="spin"></span></div>`;
}
async function sReveal(){
  if(timerInt) clearInterval(timerInt);
  const q=qNow(); if(!q) return; applyTheme();
  let ok=false, rightHtml="";
  if(q.type==="reorder"){
    const cc=(myAnswer&&myAnswer.t==="reorder")?myAnswer.cc:0;
    ok=cc===q.options.length;
    rightHtml=`Thứ tự đúng:<br><b>${q.options.map((o,i)=>`${i+1}. ${esc(o)}`).join("<br>")}</b>`+
      (myAnswer&&!ok?`<br><span class="note">Em đúng ${cc}/${q.options.length} vị trí — cố lên! 💪</span>`:"");
  } else if(q.type==="fillblank"){
    ok=!!(myAnswer&&myAnswer.t==="blank"&&myAnswer.ok);
    rightHtml=`Đáp án đúng: <b>${esc(q.options[0])}</b>`;
  } else {
    ok=myAnswer!==null&&myAnswer===q.correct;
    rightHtml=`Đáp án đúng: <b>${esc(q.options[q.correct])}</b>`;
  }
  const {data}=await sb.from("players").select("score").eq("id",myPlayer.id).single();
  const sc=data?data.score:0;
  const {data:all}=await sb.from("players").select("score").eq("room_id",room.id).order("score",{ascending:false});
  const rank=(all||[]).filter(p=>p.score>sc).length+1;
  let myStreak=0, myCorrect=0;
  try{
    const {data:mine}=await sb.from("answers").select("q_index,is_correct").eq("player_id",myPlayer.id).order("q_index");
    myStreak=streakOf(mine||[],room.current);
    myCorrect=(mine||[]).filter(r=>r.is_correct).length;
  }catch(e){}
  const comboHtml=myStreak>=2?`<div class="combo">🔥 Combo x${myStreak}! <span>+${comboBonus(myStreak)} điểm thưởng</span></div>`:"";
  const adv=document.body.dataset.gtheme==="adventure";
  const nQ=room.question_set.length;
  const journeyMine=adv?`<div class="jmine">🗺️ Em đang ở <b>chặng ${myCorrect}/${nQ}</b><div class="jtrack"><span class="jstopmini" style="left:4%">🏁</span><span class="jstopmini" style="left:96%">🏆</span><span class="jtoken" style="left:${4+Math.round(myCorrect/nQ*100)*0.92}%">🧑‍🎓</span></div></div>`:"";
  // Vòng quay may mắn: cứ 3 câu đúng được 1 lượt quay
  const earnedSpin=Math.floor(myCorrect/SPIN_EVERY);
  const canSpin=earnedSpin>spinLastMilestone()&&myAnswer!==null;
  if(canSpin) sSpinCorrect=myCorrect;
  const spinHtml=canSpin?`<div class="spinpanel" id="spinPanel">
    <h3>🎡 VÒNG QUAY MAY MẮN!</h3>
    <p class="sub">Em đã trả lời đúng <b>${myCorrect}</b> câu — được quay 1 lượt!<br>Trúng ô nào cộng ngay điểm ô đó.</p>
    <canvas id="wheelCv" width="280" height="280" data-ang="0" style="max-width:280px;width:100%"></canvas><br>
    <button class="btn big orange" id="spinBtn" onclick="sDoSpin()">🎡 QUAY NGAY</button>
  </div>`:"";
  if(ok){ if(myStreak>=3) SFX.fanfare(); else SFX.correct(); boom(innerWidth/2,innerHeight/3,50); } else SFX.wrong();
  app.innerHTML=`<div class="card">
    <h2>${myAnswer===null?"⏰ Hết giờ!":ok?"🎉 Đúng rồi!":"😅 Chưa đúng"}</h2>
    ${comboHtml}
    <div class="qtext" style="font-size:1.25rem">${rightHtml}</div>
    ${journeyMine}
    ${spinHtml}
    ${qImg(q)}
    ${q.explain?`<div class="explain">💡 ${esc(q.explain)}</div>`:""}
    <p class="sub">Điểm của em: <b>${sc}</b> • Xếp hạng: <b>${rank}</b></p>
    <p class="note">Chờ câu tiếp theo...</p></div>`;
  const wcv=document.getElementById("wheelCv"); if(wcv) drawWheel(wcv,0);
}
function sPodium(){
  applyTheme();
  sb.from("players").select("*").eq("room_id",room.id).order("score",{ascending:false}).then(({data})=>{
    const all=data||[];
    const me=all.find(p=>p.id===myPlayer.id);
    const rank=all.findIndex(p=>p.id===myPlayer.id)+1;
    const medal=rank===1?"🥇":rank===2?"🥈":rank===3?"🥉":"🎖️";
    app.innerHTML=`<div class="card"><div style="font-size:4rem">${medal}</div>
      <h2>${esc(myPlayer.name)} — hạng ${rank}</h2>
      <p class="sub">Tổng điểm: <b>${me?me.score:0}</b></p>
      <h3>🏅 Top 5</h3>
      <table class="score">${all.slice(0,5).map((p,i)=>`<tr><td>${i+1}</td><td style="text-align:left"><b>${esc(p.name)}</b></td><td><b>${p.score}</b> đ</td></tr>`).join("")}</table>
      <button class="btn big green" onclick="goHome()">🏠 Chơi ván mới</button></div>`;
    SFX.victory(); fireworks(6);
  });
}

  app.innerHTML=`<div class="card"><div class="cfgwarn">⚠️ Thầy chưa điền Supabase URL và anon key trong file index.html.<br>Mở file, tìm CONFIG ở đầu phần script và làm theo hướng dẫn nhé!</div></div>`;
}else{
  showHome();
}
</script>
